apiVersion: v1
kind: ServiceAccount
metadata:
  name: api-monetization-portal-identity
  namespace: api-monetization-identity
  annotations:
    argocd.argoproj.io/sync-wave: "5"
  labels:
    app.kubernetes.io/name: api-monetization-portal-identity
    app.kubernetes.io/part-of: api-monetization
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: api-monetization-portal-ingress-reader
  annotations:
    argocd.argoproj.io/sync-wave: "5"
  labels:
    app.kubernetes.io/part-of: api-monetization
rules:
  - apiGroups:
      - config.openshift.io
    resources:
      - ingresses
    resourceNames:
      - cluster
    verbs:
      - get
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: api-monetization-portal-ingress-reader
  annotations:
    argocd.argoproj.io/sync-wave: "5"
  labels:
    app.kubernetes.io/part-of: api-monetization
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: api-monetization-portal-ingress-reader
subjects:
  - kind: ServiceAccount
    name: api-monetization-portal-identity
    namespace: api-monetization-identity
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: api-monetization-portal-route-config
  namespace: api-monetization-identity
  annotations:
    argocd.argoproj.io/sync-wave: "5"
  labels:
    app.kubernetes.io/part-of: api-monetization
rules:
  - apiGroups:
      - ""
    resources:
      - configmaps
    verbs:
      - create
      - get
      - patch
      - update
  - apiGroups:
      - k8s.keycloak.org
    resources:
      - keycloakrealmimports
    resourceNames:
      - api-monetization-realm
    verbs:
      - get
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: api-monetization-portal-route-config
  namespace: api-monetization-identity
  annotations:
    argocd.argoproj.io/sync-wave: "5"
  labels:
    app.kubernetes.io/part-of: api-monetization
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: api-monetization-portal-route-config
subjects:
  - kind: ServiceAccount
    name: api-monetization-portal-identity
    namespace: api-monetization-identity
---
apiVersion: batch/v1
kind: Job
metadata:
  name: api-monetization-portal-route-config
  namespace: api-monetization-identity
  annotations:
    argocd.argoproj.io/hook: Sync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation,HookSucceeded
    argocd.argoproj.io/sync-wave: "10"
  labels:
    app.kubernetes.io/name: api-monetization-portal-route-config
    app.kubernetes.io/part-of: api-monetization
spec:
  activeDeadlineSeconds: 180
  backoffLimit: 2
  template:
    metadata:
      annotations:
        sidecar.istio.io/inject: "false"
      labels:
        app.kubernetes.io/name: api-monetization-portal-route-config
        app.kubernetes.io/part-of: api-monetization
    spec:
      serviceAccountName: api-monetization-portal-identity
      restartPolicy: Never
      containers:
        - name: discover
          image: registry.redhat.io/openshift4/ose-cli-rhel9:v4.22
          imagePullPolicy: IfNotPresent
          command:
            - /bin/bash
            - -Eeuo
            - pipefail
            - -c
            - |
              apps_domain=""
              for _ in $(seq 1 30); do
                apps_domain=$(oc get ingress.config.openshift.io cluster \
                  -o jsonpath='{.spec.domain}' 2>/dev/null || true)
                [[ -n $apps_domain ]] && break
                sleep 2
              done
              if [[ -z $apps_domain ]]; then
                echo "OpenShift ingress apps domain was not published" >&2
                exit 1
              fi

              portal_origin="https://monetization-control.$apps_domain"
              grafana_origin="https://api-monetization-grafana-route-api-monetization-observability.$apps_domain"
              rhdh_origin="https://developer-hub.$apps_domain"
              oc create configmap monetization-portal-route \
                --from-literal="portal-origin=$portal_origin" \
                --from-literal="portal-redirect-uri=$portal_origin/*" \
                --from-literal="grafana-origin=$grafana_origin" \
                --from-literal="grafana-redirect-uri=$grafana_origin/login/generic_oauth" \
                --from-literal="rhdh-origin=$rhdh_origin" \
                --from-literal="rhdh-redirect-uri=$rhdh_origin/api/auth/oidc/handler/frame" \
                --dry-run=client -o yaml \
                | oc apply --server-side \
                    --field-manager=api-monetization-portal-route -f -
              echo "Portal OIDC redirect is $portal_origin/*"
          resources:
            requests:
              cpu: 10m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            runAsNonRoot: true
            seccompProfile:
              type: RuntimeDefault
---
apiVersion: batch/v1
kind: Job
metadata:
  name: api-monetization-portal-identity
  namespace: api-monetization-identity
  annotations:
    argocd.argoproj.io/hook: Sync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation,HookSucceeded
    argocd.argoproj.io/sync-wave: "20"
  labels:
    app.kubernetes.io/name: api-monetization-portal-identity
    app.kubernetes.io/part-of: api-monetization
spec:
  # The RHBK admin CLI starts a JVM for each idempotent reconciliation call.
  # Keep the hook bounded while allowing enough time for a fresh realm import.
  activeDeadlineSeconds: 900
  backoffLimit: 2
  template:
    metadata:
      annotations:
        sidecar.istio.io/inject: "false"
      labels:
        app.kubernetes.io/name: api-monetization-portal-identity
        app.kubernetes.io/part-of: api-monetization
    spec:
      serviceAccountName: api-monetization-portal-identity
      restartPolicy: Never
      initContainers:
        - name: wait-for-realm-import
          image: registry.redhat.io/openshift4/ose-cli-rhel9:v4.22
          imagePullPolicy: IfNotPresent
          command:
            - /bin/bash
            - -Eeuo
            - pipefail
            - -c
            - |
              realm_import=keycloakrealmimport.k8s.keycloak.org/api-monetization-realm
              for attempt in $(seq 1 120); do
                done_status=$(oc get "$realm_import" \
                  -o jsonpath='{.status.conditions[?(@.type=="Done")].status}' \
                  2>/dev/null || true)
                if [[ $done_status == "True" ]]; then
                  echo "Keycloak realm import completed"
                  exit 0
                fi
                if (( attempt == 120 )); then
                  echo "Keycloak realm import did not complete within 10 minutes" >&2
                  oc get "$realm_import" -o yaml >&2 || true
                  exit 1
                fi
                sleep 5
              done
          resources:
            requests:
              cpu: 10m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            runAsNonRoot: true
            seccompProfile:
              type: RuntimeDefault
      containers:
        - name: configure
          image: registry.redhat.io/rhbk/keycloak-rhel9:26.6
          imagePullPolicy: IfNotPresent
          env:
            - name: KEYCLOAK_ADMIN
              valueFrom:
                secretKeyRef:
                  name: api-monetization-initial-admin
                  key: username
            - name: KEYCLOAK_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: api-monetization-initial-admin
                  key: password
            - name: AUTOMATION_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: monetization-portal-credentials
                  key: automation-client-secret
            - name: PORTAL_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: monetization-portal-credentials
                  key: portal-admin-password
            - name: PORTAL_DEVELOPER_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: monetization-developer-credentials
                  key: portal-developer-password
            - name: DEVELOPER_AUTOMATION_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: monetization-developer-credentials
                  key: developer-automation-client-secret
            - name: GRAFANA_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: grafana-keycloak-client
                  key: client-secret
            - name: RHDH_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: rhdh-keycloak-client
                  key: client-secret
            - name: PORTAL_ORIGIN
              valueFrom:
                configMapKeyRef:
                  name: monetization-portal-route
                  key: portal-origin
            - name: PORTAL_REDIRECT_URI
              valueFrom:
                configMapKeyRef:
                  name: monetization-portal-route
                  key: portal-redirect-uri
            - name: GRAFANA_ORIGIN
              valueFrom:
                configMapKeyRef:
                  name: monetization-portal-route
                  key: grafana-origin
            - name: GRAFANA_REDIRECT_URI
              valueFrom:
                configMapKeyRef:
                  name: monetization-portal-route
                  key: grafana-redirect-uri
            - name: RHDH_ORIGIN
              valueFrom:
                configMapKeyRef:
                  name: monetization-portal-route
                  key: rhdh-origin
            - name: RHDH_REDIRECT_URI
              valueFrom:
                configMapKeyRef:
                  name: monetization-portal-route
                  key: rhdh-redirect-uri
          command:
            - /bin/bash
            - -Eeuo
            - pipefail
            - -c
            - |
              kcadm=/opt/keycloak/bin/kcadm.sh
              run_kcadm() {
                # The Java admin client has no useful default request deadline.
                # Fail the hook and let its bounded Job retry instead of leaving
                # Argo CD in Syncing forever on a stalled Keycloak request.
                timeout --signal=TERM --kill-after=5s 30s "$kcadm" "$@"
              }
              server=http://api-monetization-service:8080
              realm=api-monetization
              admin_role=monetization-admin
              developer_role=monetization-developer

              for attempt in $(seq 1 60); do
                if run_kcadm config credentials --config /tmp/kcadm.config \
                  --server "$server" --realm master \
                  --user "$KEYCLOAK_ADMIN" --password "$KEYCLOAK_ADMIN_PASSWORD"; then
                  break
                fi
                if (( attempt == 60 )); then
                  echo "Keycloak admin API did not become ready" >&2
                  exit 1
                fi
                sleep 5
              done

              for attempt in $(seq 1 60); do
                if run_kcadm get "realms/$realm" --config /tmp/kcadm.config >/dev/null 2>&1; then
                  break
                fi
                if (( attempt == 60 )); then
                  echo "Realm $realm did not become ready" >&2
                  exit 1
                fi
                sleep 5
              done

              json_id() {
                sed -n 's/.*"id" *: *"\([^"]*\)".*/\1/p' | head -n 1
              }

              if ! run_kcadm get "roles/$admin_role" -r "$realm" \
                --config /tmp/kcadm.config >/dev/null 2>&1; then
                run_kcadm create roles -r "$realm" --config /tmp/kcadm.config \
                  -s name="$admin_role" \
                  -s description='Administrator of API subscriptions and plans'
              fi
              if ! run_kcadm get "roles/$developer_role" -r "$realm" \
                --config /tmp/kcadm.config >/dev/null 2>&1; then
                run_kcadm create roles -r "$realm" --config /tmp/kcadm.config \
                  -s name="$developer_role" \
                  -s description='Developer who can subscribe to API products and manage credentials'
              fi

              cat >/tmp/portal-client.json <<JSON
              {
                "clientId": "monetization-portal",
                "name": "API Monetization Portal",
                "description": "Browser client for the API monetization administration portal",
                "enabled": true,
                "protocol": "openid-connect",
                "publicClient": true,
                "standardFlowEnabled": true,
                "directAccessGrantsEnabled": false,
                "serviceAccountsEnabled": false,
                "fullScopeAllowed": true,
                "redirectUris": ["$PORTAL_REDIRECT_URI"],
                "webOrigins": ["$PORTAL_ORIGIN"],
                "attributes": {
                  "pkce.code.challenge.method": "S256",
                  "post.logout.redirect.uris": "$PORTAL_REDIRECT_URI"
                },
                "protocolMappers": [
                  {
                    "name": "control-plane-audience",
                    "protocol": "openid-connect",
                    "protocolMapper": "oidc-audience-mapper",
                    "config": {
                      "included.custom.audience": "monetization-control",
                      "access.token.claim": "true"
                    }
                  },
                  {
                    "name": "inventory-api-audience",
                    "protocol": "openid-connect",
                    "protocolMapper": "oidc-audience-mapper",
                    "config": {
                      "included.custom.audience": "api-monetization",
                      "access.token.claim": "true"
                    }
                  }
                ]
              }
              JSON

              cat >/tmp/automation-client.json <<JSON
              {
                "clientId": "monetization-automation",
                "name": "API Monetization Automation",
                "description": "Service client used by deterministic demo automation",
                "enabled": true,
                "protocol": "openid-connect",
                "publicClient": false,
                "clientAuthenticatorType": "client-secret",
                "secret": "$AUTOMATION_CLIENT_SECRET",
                "serviceAccountsEnabled": true,
                "standardFlowEnabled": false,
                "directAccessGrantsEnabled": false,
                "fullScopeAllowed": true,
                "protocolMappers": [{
                  "name": "control-plane-audience",
                  "protocol": "openid-connect",
                  "protocolMapper": "oidc-audience-mapper",
                  "config": {
                    "included.custom.audience": "monetization-control",
                    "access.token.claim": "true"
                  }
                }]
              }
              JSON

              cat >/tmp/developer-automation-client.json <<JSON
              {
                "clientId": "monetization-developer-automation",
                "name": "API Monetization Developer Automation",
                "description": "Service client used to verify developer self-service APIs",
                "enabled": true,
                "protocol": "openid-connect",
                "publicClient": false,
                "clientAuthenticatorType": "client-secret",
                "secret": "$DEVELOPER_AUTOMATION_CLIENT_SECRET",
                "serviceAccountsEnabled": true,
                "standardFlowEnabled": false,
                "directAccessGrantsEnabled": false,
                "fullScopeAllowed": true,
                "protocolMappers": [
                  {
                    "name": "control-plane-audience",
                    "protocol": "openid-connect",
                    "protocolMapper": "oidc-audience-mapper",
                    "config": {
                      "included.custom.audience": "monetization-control",
                      "access.token.claim": "true"
                    }
                  },
                  {
                    "name": "inventory-api-audience",
                    "protocol": "openid-connect",
                    "protocolMapper": "oidc-audience-mapper",
                    "config": {
                      "included.custom.audience": "api-monetization",
                      "access.token.claim": "true"
                    }
                  }
                ]
              }
              JSON

              cat >/tmp/grafana-client.json <<JSON
              {
                "clientId": "api-monetization-grafana",
                "name": "API Monetization Grafana",
                "description": "Confidential browser client for the API monetization business dashboard",
                "enabled": true,
                "protocol": "openid-connect",
                "publicClient": false,
                "clientAuthenticatorType": "client-secret",
                "secret": "$GRAFANA_CLIENT_SECRET",
                "standardFlowEnabled": true,
                "directAccessGrantsEnabled": false,
                "serviceAccountsEnabled": false,
                "fullScopeAllowed": true,
                "redirectUris": ["$GRAFANA_REDIRECT_URI"],
                "webOrigins": ["$GRAFANA_ORIGIN"],
                "attributes": {
                  "pkce.code.challenge.method": "S256",
                  "post.logout.redirect.uris": "$GRAFANA_ORIGIN/*"
                },
                "protocolMappers": [{
                  "name": "grafana-realm-roles",
                  "protocol": "openid-connect",
                  "protocolMapper": "oidc-usermodel-realm-role-mapper",
                  "config": {
                    "claim.name": "roles",
                    "jsonType.label": "String",
                    "multivalued": "true",
                    "access.token.claim": "true",
                    "id.token.claim": "true",
                    "userinfo.token.claim": "true"
                  }
                }]
              }
              JSON

              cat >/tmp/rhdh-client.json <<JSON
              {
                "clientId": "rhdh",
                "name": "API Monetization Developer Hub",
                "description": "Confidential OIDC client and read-only organization provider for Red Hat Developer Hub",
                "enabled": true,
                "protocol": "openid-connect",
                "publicClient": false,
                "clientAuthenticatorType": "client-secret",
                "secret": "$RHDH_CLIENT_SECRET",
                "standardFlowEnabled": true,
                "directAccessGrantsEnabled": false,
                "serviceAccountsEnabled": true,
                "fullScopeAllowed": true,
                "redirectUris": ["$RHDH_REDIRECT_URI"],
                "webOrigins": ["$RHDH_ORIGIN"],
                "attributes": {
                  "pkce.code.challenge.method": "S256",
                  "post.logout.redirect.uris": "$RHDH_ORIGIN/*"
                },
                "protocolMappers": [
                  {
                    "name": "control-plane-audience",
                    "protocol": "openid-connect",
                    "protocolMapper": "oidc-audience-mapper",
                    "config": {
                      "included.custom.audience": "monetization-control",
                      "access.token.claim": "true"
                    }
                  },
                  {
                    "name": "api-gateway-audience",
                    "protocol": "openid-connect",
                    "protocolMapper": "oidc-audience-mapper",
                    "config": {
                      "included.custom.audience": "api-monetization",
                      "access.token.claim": "true"
                    }
                  }
                ]
              }
              JSON

              upsert_client() {
                local client_id=$1
                local definition=$2
                local client_uuid
                client_uuid=$(run_kcadm get clients -r "$realm" \
                  --config /tmp/kcadm.config -q clientId="$client_id" --fields id | json_id)
                if [[ -z $client_uuid ]]; then
                  run_kcadm create clients -r "$realm" --config /tmp/kcadm.config \
                    -f "$definition" >/dev/null
                else
                  run_kcadm update "clients/$client_uuid" -r "$realm" \
                    --config /tmp/kcadm.config -f "$definition"
                fi
                run_kcadm get clients -r "$realm" --config /tmp/kcadm.config \
                  -q clientId="$client_id" --fields id | json_id
              }

              portal_client_uuid=$(upsert_client monetization-portal /tmp/portal-client.json)
              automation_client_uuid=$(upsert_client monetization-automation /tmp/automation-client.json)
              developer_automation_client_uuid=$(upsert_client monetization-developer-automation /tmp/developer-automation-client.json)
              grafana_client_uuid=$(upsert_client api-monetization-grafana /tmp/grafana-client.json)
              rhdh_client_uuid=$(upsert_client rhdh /tmp/rhdh-client.json)
              if [[ -z $portal_client_uuid || -z $automation_client_uuid || \
                -z $developer_automation_client_uuid || -z $grafana_client_uuid || \
                -z $rhdh_client_uuid ]]; then
                echo "Portal OIDC clients were not created" >&2
                exit 1
              fi

              ensure_group() {
                local group_name=$1
                local group_id
                group_id=$(run_kcadm get groups -r "$realm" --config /tmp/kcadm.config \
                  -q search="$group_name" --fields id,name | json_id)
                if [[ -z $group_id ]]; then
                  run_kcadm create groups -r "$realm" --config /tmp/kcadm.config \
                    -s name="$group_name" >/dev/null
                  group_id=$(run_kcadm get groups -r "$realm" --config /tmp/kcadm.config \
                    -q search="$group_name" --fields id,name | json_id)
                fi
                if [[ -z $group_id ]]; then
                  echo "Keycloak group $group_name was not created" >&2
                  exit 1
                fi
                printf '%s\n' "$group_id"
              }

              consumer_group_id=$(ensure_group api-consumers)
              owner_group_id=$(ensure_group api-owners)
              admin_group_id=$(ensure_group api-admins)
              run_kcadm update "realms/$realm" --config /tmp/kcadm.config \
                -s registrationAllowed=true

              echo "Configuring portal administrator"
              admin_user_id=$(run_kcadm get users -r "$realm" --config /tmp/kcadm.config \
                -q username=demo-admin -q exact=true --fields id | json_id)
              if [[ -z $admin_user_id ]]; then
                run_kcadm create users -r "$realm" --config /tmp/kcadm.config \
                  -s username=demo-admin -s enabled=true \
                  -s email=demo-admin@example.invalid -s emailVerified=true \
                  -s firstName=Demo -s lastName=Administrator >/dev/null
              else
                run_kcadm update "users/$admin_user_id" -r "$realm" \
                  --config /tmp/kcadm.config -s enabled=true \
                  -s email=demo-admin@example.invalid -s emailVerified=true \
                  -s firstName=Demo -s lastName=Administrator
              fi
              admin_user_id=$(run_kcadm get users -r "$realm" --config /tmp/kcadm.config \
                -q username=demo-admin -q exact=true --fields id | json_id)
              if [[ -z $admin_user_id ]]; then
                echo "Portal administrator was not created" >&2
                exit 1
              fi
              run_kcadm set-password -r "$realm" --config /tmp/kcadm.config \
                --userid "$admin_user_id" --new-password "$PORTAL_ADMIN_PASSWORD"
              run_kcadm add-roles -r "$realm" --config /tmp/kcadm.config \
                --uid "$admin_user_id" --rolename "$admin_role"
              run_kcadm update "users/$admin_user_id/groups/$owner_group_id" \
                -r "$realm" --config /tmp/kcadm.config -n
              run_kcadm update "users/$admin_user_id/groups/$admin_group_id" \
                -r "$realm" --config /tmp/kcadm.config -n
              # The consumer role has a conditional catalog policy that is
              # intentionally limited to API and Group entities. Red Hat
              # Developer Hub gives conditional policies precedence over a
              # basic allow, so an administrator must not retain the default
              # api-consumers membership or Golden Path Template entities are
              # filtered even though the administrator is also an API owner.
              for attempt in $(seq 1 5); do
                admin_group_ids=$(run_kcadm get "users/$admin_user_id/groups" \
                  -r "$realm" --config /tmp/kcadm.config --fields id \
                  | sed -n 's/.*"id" *: *"\([^"]*\)".*/\1/p')
                if ! grep -Fxq "$consumer_group_id" <<<"$admin_group_ids"; then
                  break
                fi
                run_kcadm delete "users/$admin_user_id/groups/$consumer_group_id" \
                  -r "$realm" --config /tmp/kcadm.config
                sleep 2
              done
              admin_group_ids=$(run_kcadm get "users/$admin_user_id/groups" \
                -r "$realm" --config /tmp/kcadm.config --fields id \
                | sed -n 's/.*"id" *: *"\([^"]*\)".*/\1/p')
              if grep -Fxq "$consumer_group_id" <<<"$admin_group_ids"; then
                echo "Portal administrator still belongs to api-consumers" >&2
                exit 1
              fi

              # Enable the consumer default only after creating and verifying
              # the elevated administrator. New self-registered users and the
              # demo developer still receive the consumer role automatically.
              run_kcadm update "realms/$realm" --config /tmp/kcadm.config \
                -s 'defaultGroups=["/api-consumers"]'

              echo "Configuring portal developer"
              # Keycloak username searches are partial by default. The exact
              # filter prevents demo-developer from matching the existing
              # service-account-demo-developer-client identity.
              developer_user_id=$(run_kcadm get users -r "$realm" --config /tmp/kcadm.config \
                -q username=demo-developer -q exact=true --fields id | json_id)
              if [[ -z $developer_user_id ]]; then
                run_kcadm create users -r "$realm" --config /tmp/kcadm.config \
                  -s username=demo-developer -s enabled=true \
                  -s email=portal-demo-developer@example.invalid -s emailVerified=true \
                  -s firstName=Demo -s lastName=Developer >/dev/null
              else
                run_kcadm update "users/$developer_user_id" -r "$realm" \
                  --config /tmp/kcadm.config -s enabled=true \
                  -s email=portal-demo-developer@example.invalid -s emailVerified=true \
                  -s firstName=Demo -s lastName=Developer
              fi
              developer_user_id=$(run_kcadm get users -r "$realm" --config /tmp/kcadm.config \
                -q username=demo-developer -q exact=true --fields id | json_id)
              if [[ -z $developer_user_id ]]; then
                echo "Portal developer was not created" >&2
                exit 1
              fi
              run_kcadm set-password -r "$realm" --config /tmp/kcadm.config \
                --userid "$developer_user_id" --new-password "$PORTAL_DEVELOPER_PASSWORD"
              run_kcadm add-roles -r "$realm" --config /tmp/kcadm.config \
                --uid "$developer_user_id" --rolename "$developer_role"
              run_kcadm update "users/$developer_user_id/groups/$consumer_group_id" \
                -r "$realm" --config /tmp/kcadm.config -n

              service_user_id=$(run_kcadm get "clients/$automation_client_uuid/service-account-user" \
                -r "$realm" --config /tmp/kcadm.config --fields id | json_id)
              if [[ -z $service_user_id ]]; then
                echo "Automation service account was not created" >&2
                exit 1
              fi
              run_kcadm add-roles -r "$realm" --config /tmp/kcadm.config \
                --uid "$service_user_id" --rolename "$admin_role"
              developer_service_user_id=$(run_kcadm get "clients/$developer_automation_client_uuid/service-account-user" \
                -r "$realm" --config /tmp/kcadm.config --fields id | json_id)
              if [[ -z $developer_service_user_id ]]; then
                echo "Developer automation service account was not created" >&2
                exit 1
              fi
              run_kcadm add-roles -r "$realm" --config /tmp/kcadm.config \
                --uid "$developer_service_user_id" --rolename "$developer_role"
              rhdh_service_user_id=$(run_kcadm get "clients/$rhdh_client_uuid/service-account-user" \
                -r "$realm" --config /tmp/kcadm.config --fields id | json_id)
              if [[ -z $rhdh_service_user_id ]]; then
                echo "Developer Hub service account was not created" >&2
                exit 1
              fi
              for management_role in view-users query-users query-groups; do
                run_kcadm add-roles -r "$realm" --config /tmp/kcadm.config \
                  --uid "$rhdh_service_user_id" --cclientid realm-management \
                  --rolename "$management_role"
              done
              echo "Keycloak portal, Grafana, and Developer Hub identities are configured"
          resources:
            requests:
              cpu: 250m
              memory: 128Mi
            limits:
              cpu: "2"
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            runAsNonRoot: true
            seccompProfile:
              type: RuntimeDefault
