apiVersion: security.istio.io/v1
kind: PeerAuthentication
metadata:
  name: default
  namespace: api-monetization-ai
  labels:
    app.kubernetes.io/name: ai-model-mtls
    app.kubernetes.io/part-of: api-monetization
spec:
  mtls:
    mode: STRICT
---
apiVersion: security.istio.io/v1
kind: PeerAuthentication
metadata:
  name: default
  namespace: api-monetization-apps
  labels:
    app.kubernetes.io/name: service-mesh-mtls
    app.kubernetes.io/part-of: api-monetization
spec:
  mtls:
    mode: STRICT
---
apiVersion: security.istio.io/v1
kind: PeerAuthentication
metadata:
  name: inventory-api
  namespace: api-monetization-apps
  labels:
    app.kubernetes.io/name: inventory-api
    app.kubernetes.io/part-of: api-monetization
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: inventory-api
  mtls:
    mode: STRICT
  portLevelMtls:
    "8082":
      mode: DISABLE
---
