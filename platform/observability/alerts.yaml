apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: api-monetization-demo
  namespace: api-monetization-observability
  labels:
    app.kubernetes.io/part-of: api-monetization
spec:
  groups:
    - name: api-monetization.rules
      rules:
        - alert: MonetizedAPIHighErrorRate
          expr: >-
            sum(rate(api_requests_total{service="inventory-api",status=~"5.."}[5m]))
            /
            clamp_min(sum(rate(api_requests_total{service="inventory-api"}[5m])), 0.001)
            > 0.05
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: Inventory API error rate is above five percent
        - alert: MonetizationControlUnavailable
          expr: >-
            absent(up{namespace="api-monetization-data",pod=~"monetization-control-.*"} == 1)
          for: 3m
          labels:
            severity: critical
          annotations:
            summary: Monetization control-plane metrics target is unavailable
        - alert: MonetizedAPIRateLimitDenialHigh
          expr: >-
            sum(rate(limited_calls{limitador_namespace=~"api-monetization-apps/inventory-(api-key|jwt)"}[5m]))
            /
            clamp_min(
              sum(rate(limited_calls{limitador_namespace=~"api-monetization-apps/inventory-(api-key|jwt)"}[5m]))
              + sum(rate(authorized_calls{limitador_namespace=~"api-monetization-apps/inventory-(api-key|jwt)"}[5m])),
              0.001
            ) > 0.25
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: More than 25 percent of monetized API calls are rate limited
            description: Connectivity Link is rejecting a sustained share of API-key or JWT traffic; rejected calls are observable but not billable.
