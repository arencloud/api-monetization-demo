apiVersion: grafana.integreatly.org/v1beta1
kind: Grafana
metadata:
  name: api-monetization-grafana
  namespace: api-monetization-observability
  annotations:
    argocd.argoproj.io/sync-wave: "0"
  labels:
    app.kubernetes.io/name: api-monetization-grafana
    app.kubernetes.io/part-of: api-monetization
    dashboards: api-monetization
spec:
  disableDefaultAdminSecret: true
  route:
    spec:
      tls:
        termination: edge
        insecureEdgeTerminationPolicy: Redirect
  config:
    log:
      mode: console
    auth:
      disable_login_form: "false"
      oauth_auto_login: "true"
    auth.basic:
      enabled: "true"
    auth.generic_oauth:
      enabled: "true"
      name: Red Hat build of Keycloak
      allow_sign_up: "true"
      client_id: api-monetization-grafana
      client_secret: ${GRAFANA_OAUTH_CLIENT_SECRET}
      scopes: openid profile email offline_access
      email_attribute_path: email
      login_attribute_path: preferred_username
      name_attribute_path: name
      auth_url: ${KEYCLOAK_ORIGIN}/realms/api-monetization/protocol/openid-connect/auth
      token_url: ${KEYCLOAK_ORIGIN}/realms/api-monetization/protocol/openid-connect/token
      api_url: ${KEYCLOAK_ORIGIN}/realms/api-monetization/protocol/openid-connect/userinfo
      signout_redirect_url: ${KEYCLOAK_ORIGIN}/realms/api-monetization/protocol/openid-connect/logout?client_id=api-monetization-grafana&post_logout_redirect_uri=${GRAFANA_ROOT_URL}
      role_attribute_path: "contains(roles[*], 'monetization-admin') && 'Admin' || contains(roles[*], 'monetization-developer') && 'Viewer' || 'None'"
      role_attribute_strict: "true"
      allow_assign_grafana_admin: "false"
      skip_org_role_sync: "false"
      use_pkce: "true"
      use_refresh_token: "true"
      tls_client_ca: /etc/grafana/oauth/router-ca.crt
      tls_skip_verify_insecure: "false"
    security:
      cookie_secure: "true"
      disable_gravatar: "true"
    users:
      allow_sign_up: "false"
    server:
      root_url: ${GRAFANA_ROOT_URL}
  deployment:
    spec:
      replicas: 1
      template:
        spec:
          containers:
            - name: grafana
              env:
                - name: GF_SECURITY_ADMIN_USER
                  value: admin
                - name: GF_SECURITY_ADMIN_PASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: api-monetization-grafana-admin
                      key: GF_SECURITY_ADMIN_PASSWORD
                - name: GRAFANA_OAUTH_CLIENT_SECRET
                  valueFrom:
                    secretKeyRef:
                      name: api-monetization-grafana-oauth
                      key: client-secret
                - name: GRAFANA_ROOT_URL
                  valueFrom:
                    configMapKeyRef:
                      name: api-monetization-grafana-oauth-config
                      key: grafana-root-url
                - name: KEYCLOAK_ORIGIN
                  valueFrom:
                    configMapKeyRef:
                      name: api-monetization-grafana-oauth-config
                      key: keycloak-origin
              volumeMounts:
                - name: grafana-oauth-ca
                  mountPath: /etc/grafana/oauth
                  readOnly: true
              resources:
                requests:
                  cpu: 50m
                  memory: 256Mi
                limits:
                  cpu: "1"
                  memory: 1Gi
          volumes:
            - name: grafana-oauth-ca
              configMap:
                name: api-monetization-grafana-oauth-config
                items:
                  - key: router-ca.crt
                    path: router-ca.crt
---
apiVersion: grafana.integreatly.org/v1beta1
kind: GrafanaDatasource
metadata:
  name: api-monetization-thanos
  namespace: api-monetization-observability
  annotations:
    argocd.argoproj.io/sync-wave: "5"
  labels:
    app.kubernetes.io/part-of: api-monetization
spec:
  uid: openshift-thanos
  instanceSelector:
    matchLabels:
      dashboards: api-monetization
  valuesFrom:
    - targetPath: secureJsonData.httpHeaderValue1
      valueFrom:
        secretKeyRef:
          name: api-monetization-grafana-thanos-token
          key: token
    - targetPath: secureJsonData.tlsCACert
      valueFrom:
        configMapKeyRef:
          name: api-monetization-service-ca
          key: service-ca.crt
  datasource:
    name: OpenShift Thanos
    type: prometheus
    access: proxy
    url: https://thanos-querier.openshift-monitoring.svc:9091
    isDefault: true
    editable: false
    jsonData:
      httpHeaderName1: Authorization
      timeInterval: 15s
      tlsAuthWithCACert: true
    secureJsonData:
      httpHeaderValue1: Bearer ${token}
      tlsCACert: ${service-ca.crt}
---
apiVersion: grafana.integreatly.org/v1beta1
kind: GrafanaDashboard
metadata:
  name: api-monetization
  namespace: api-monetization-observability
  annotations:
    argocd.argoproj.io/sync-wave: "5"
  labels:
    app.kubernetes.io/part-of: api-monetization
spec:
  instanceSelector:
    matchLabels:
      dashboards: api-monetization
  configMapRef:
    name: api-monetization-grafana-dashboard
    key: api-monetization.json
  resyncPeriod: 1m
