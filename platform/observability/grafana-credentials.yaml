apiVersion: generators.external-secrets.io/v1alpha1
kind: Password
metadata:
  name: api-monetization-grafana-password
  namespace: api-monetization-observability
  annotations:
    argocd.argoproj.io/sync-wave: "-5"
  labels:
    app.kubernetes.io/part-of: api-monetization
spec:
  length: 32
  digits: 8
  symbols: 0
  allowRepeat: true
  secretKeys:
    - GF_SECURITY_ADMIN_PASSWORD
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: api-monetization-grafana-admin
  namespace: api-monetization-observability
  annotations:
    argocd.argoproj.io/sync-wave: "-4"
  labels:
    app.kubernetes.io/part-of: api-monetization
spec:
  refreshPolicy: CreatedOnce
  target:
    name: api-monetization-grafana-admin
    creationPolicy: Orphan
    immutable: true
  dataFrom:
    - sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: Password
          name: api-monetization-grafana-password
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: api-monetization-grafana-oauth
  namespace: api-monetization-observability
  annotations:
    argocd.argoproj.io/sync-wave: "-4"
  labels:
    app.kubernetes.io/part-of: api-monetization
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: SecretStore
    name: api-monetization-identity
  target:
    name: api-monetization-grafana-oauth
    creationPolicy: Owner
  data:
    - secretKey: client-secret
      remoteRef:
        key: grafana-keycloak-client
        property: client-secret
