apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: inventory-api-key
  namespace: api-monetization-apps
  annotations:
    argocd.argoproj.io/sync-wave: "10"
  labels:
    app.kubernetes.io/name: inventory-api
    app.kubernetes.io/part-of: api-monetization
    deployment: inventory-api
    service: inventory-api
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: api-monetization
      namespace: api-monetization-gateway
      sectionName: http
  hostnames:
    # Replaced by the route-host alignment hook with the admitted OpenShift
    # Route hostname. The reserved suffix keeps the pre-hook state harmless.
    - api-monetization.invalid
  rules:
    - name: inventory
      matches:
        - method: GET
          path:
            type: PathPrefix
            value: /inventory
      filters:
        - type: ResponseHeaderModifier
          responseHeaderModifier:
            set:
              - {name: Access-Control-Allow-Origin, value: "*"}
              - {name: Access-Control-Expose-Headers, value: "X-Monetization-Billable-Units, X-RateLimit-Limit, X-RateLimit-Remaining, X-RateLimit-Reset"}
      backendRefs:
        - group: ""
          kind: Service
          name: inventory-api
          port: 8080
          weight: 1
---
apiVersion: gateway.networking.k8s.io/v1
