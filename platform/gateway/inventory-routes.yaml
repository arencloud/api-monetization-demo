---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: inventory-api-key-preflight
  namespace: api-monetization-apps
  annotations:
    argocd.argoproj.io/sync-wave: "10"
  labels:
    app.kubernetes.io/name: inventory-api
    app.kubernetes.io/part-of: api-monetization
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: api-monetization
      namespace: api-monetization-gateway
      sectionName: http
  hostnames: [api-monetization.invalid]
  rules:
    - name: inventory-preflight
      matches:
        - method: OPTIONS
          path: {type: PathPrefix, value: /inventory}
      filters:
        - type: ResponseHeaderModifier
          responseHeaderModifier:
            set:
              - {name: Access-Control-Allow-Origin, value: "*"}
              - {name: Access-Control-Allow-Methods, value: "GET, OPTIONS"}
              - {name: Access-Control-Allow-Headers, value: "Authorization, Content-Type"}
              - {name: Access-Control-Max-Age, value: "600"}
      backendRefs:
        - {group: "", kind: Service, name: inventory-api, port: 8080, weight: 1}
---
