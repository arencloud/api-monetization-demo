apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: inventory-api-key
  namespace: api-monetization-apps
  annotations:
    argocd.argoproj.io/sync-wave: "10"
  labels:
    app.kubernetes.io/name: inventory-api
    app.kubernetes.io/part-of: api-monetization
    deployment: inventory-api
    service: inventory-api
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: api-monetization
      namespace: api-monetization-gateway
      sectionName: http
  hostnames:
    - api-monetization.demo
  rules:
    - name: inventory
      matches:
        - method: GET
          path:
            type: PathPrefix
            value: /inventory
      backendRefs:
        - name: inventory-api
          port: 8080
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
