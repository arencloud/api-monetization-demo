  labels:
    app.kubernetes.io/name: inventory-api
    app.kubernetes.io/part-of: api-monetization
    deployment: inventory-api
    service: inventory-api
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: api-monetization
      namespace: api-monetization-gateway
      sectionName: http
  hostnames:
    - jwt.api-monetization.demo
  rules:
    - name: inventory
