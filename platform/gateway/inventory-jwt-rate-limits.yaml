apiVersion: kuadrant.io/v1
kind: RateLimitPolicy
metadata:
  name: inventory-jwt-plans
  namespace: api-monetization-apps
  annotations:
    argocd.argoproj.io/sync-wave: "30"
  labels:
    app.kubernetes.io/part-of: api-monetization
spec:
  targetRef:
    group: gateway.networking.k8s.io
    kind: HTTPRoute
    name: inventory-jwt
  limits:
    free:
      rates:
        - limit: 10
          window: 1m
      counters:
        - expression: auth.identity.azp
      when:
        - predicate: auth.identity.plan == "free"
    developer:
      rates:
        - limit: 1000
          window: 1m
      counters:
        - expression: auth.identity.azp
      when:
        - predicate: auth.identity.plan == "developer"
    business:
      rates:
        - limit: 10000
          window: 1m
      counters:
        - expression: auth.identity.azp
      when:
        - predicate: auth.identity.plan == "business"
