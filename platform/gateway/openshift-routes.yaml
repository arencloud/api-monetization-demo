apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: api-monetization
  namespace: api-monetization-gateway
  annotations:
    argocd.argoproj.io/sync-wave: "10"
  labels:
    app.kubernetes.io/name: api-monetization-gateway
    app.kubernetes.io/part-of: api-monetization
spec:
  subdomain: api-monetization
  tls:
    termination: edge
    insecureEdgeTerminationPolicy: Redirect
  port:
    targetPort: http
  to:
    kind: Service
    # This is the standard Istio Gateway API Service name. The route-host hook
    # also discovers and patches the generated Service to avoid relying on it.
    name: api-monetization-istio
    weight: 100
---
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: api-monetization-jwt
  namespace: api-monetization-gateway
  annotations:
    argocd.argoproj.io/sync-wave: "10"
  labels:
    app.kubernetes.io/name: api-monetization-gateway
    app.kubernetes.io/part-of: api-monetization
spec:
  # Keep the generated hostname directly beneath the ingress apps domain so it
  # is covered by the standard OpenShift wildcard ingress certificate.
  subdomain: api-monetization-jwt
  tls:
    termination: edge
    insecureEdgeTerminationPolicy: Redirect
  port:
    targetPort: http
  to:
    kind: Service
    name: api-monetization-istio
    weight: 100
