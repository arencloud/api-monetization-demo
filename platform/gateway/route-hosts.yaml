apiVersion: batch/v1
kind: Job
metadata:
  name: api-monetization-route-host-migration
  namespace: api-monetization-gateway
  annotations:
    argocd.argoproj.io/hook: Sync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation,HookSucceeded
    argocd.argoproj.io/sync-wave: "9"
  labels:
    app.kubernetes.io/name: api-monetization-route-host-migration
    app.kubernetes.io/part-of: api-monetization
spec:
  activeDeadlineSeconds: 180
  backoffLimit: 2
  template:
    metadata:
      annotations:
        sidecar.istio.io/inject: "false"
      labels:
        app.kubernetes.io/name: api-monetization-route-host-migration
        app.kubernetes.io/part-of: api-monetization
    spec:
      restartPolicy: Never
      serviceAccountName: api-monetization-route-hosts
      containers:
        - name: migrate
          image: registry.redhat.io/openshift4/ose-cli-rhel9:v4.22
          imagePullPolicy: IfNotPresent
          command:
            - /bin/bash
            - -Eeuo
            - pipefail
            - -c
            - |
              api() {
                timeout -k 2s 8s oc --cache-dir=/tmp/.kube/cache --request-timeout=5s "$@"
              }

              retry_api() {
                local attempt
                for attempt in $(seq 1 6); do
                  if api "$@"; then
                    return 0
                  fi
                  if (( attempt < 6 )); then
                    echo "API request failed on attempt $attempt/6; retrying" >&2
                    sleep 5
                  fi
                done
                return 1
              }

              migrate_route() {
                local route_name=$1
                local old_host=$2
                local old_subdomain=${3:-}
                local current_host
                local current_subdomain

                current_host=$(api get route "$route_name" -o jsonpath='{.spec.host}' 2>/dev/null || true)
                current_subdomain=$(api get route "$route_name" -o jsonpath='{.spec.subdomain}' 2>/dev/null || true)
                if [[ $current_host == "$old_host" || \
                  ( -n $old_subdomain && $current_subdomain == "$old_subdomain" ) ]]; then
                  echo "removing legacy Route $route_name"
                  retry_api delete route "$route_name" --wait=true --timeout=60s
                fi
              }

              migrate_route api-monetization api-monetization.demo
              migrate_route api-monetization-jwt jwt.api-monetization.demo jwt.api-monetization
          resources:
            requests:
              cpu: 10m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            runAsNonRoot: true
            seccompProfile:
              type: RuntimeDefault
---
apiVersion: batch/v1
kind: Job
metadata:
  name: api-monetization-route-hosts
  namespace: api-monetization-gateway
  annotations:
    argocd.argoproj.io/hook: Sync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation,HookSucceeded
    argocd.argoproj.io/sync-wave: "20"
  labels:
    app.kubernetes.io/name: api-monetization-route-hosts
    app.kubernetes.io/part-of: api-monetization
spec:
  activeDeadlineSeconds: 900
  backoffLimit: 2
  template:
    metadata:
      annotations:
        sidecar.istio.io/inject: "false"
      labels:
        app.kubernetes.io/name: api-monetization-route-hosts
        app.kubernetes.io/part-of: api-monetization
    spec:
      restartPolicy: Never
      serviceAccountName: api-monetization-route-hosts
      containers:
        - name: align
          image: registry.redhat.io/openshift4/ose-cli-rhel9:v4.22
          imagePullPolicy: IfNotPresent
          command:
            - /bin/bash
            - -Eeuo
            - pipefail
            - -c
            - |
              api() {
                timeout -k 2s 8s oc --cache-dir=/tmp/.kube/cache --request-timeout=5s "$@"
              }

              retry_api() {
                local attempt
                for attempt in $(seq 1 6); do
                  if api "$@"; then
                    return 0
                  fi
                  if (( attempt < 6 )); then
                    echo "API request failed on attempt $attempt/6; retrying" >&2
                    sleep 5
                  fi
                done
                return 1
              }

              route_host() {
                local route_name=$1
                local host
                local admitted

                for _ in $(seq 1 60); do
                  host=$(api get route "$route_name" -o jsonpath='{.status.ingress[0].host}' 2>/dev/null || true)
                  admitted=$(api get route "$route_name" -o jsonpath='{.status.ingress[0].conditions[?(@.type=="Admitted")].status}' 2>/dev/null || true)
                  if [[ -n $host && $admitted == True ]]; then
                    printf '%s' "$host"
                    return 0
                  fi
                  sleep 5
                done

                echo "Route $route_name was not admitted before the timeout" >&2
                return 1
              }

              bind_routes_to_gateway_service() {
                local gateway_service=""

                for _ in $(seq 1 60); do
                  gateway_service=$(api get services \
                    -l gateway.networking.k8s.io/gateway-name=api-monetization,gateway.networking.k8s.io/gateway-class-name=istio \
                    -o jsonpath='{.items[0].metadata.name}' 2>/dev/null || true)
                  [[ -n $gateway_service ]] && break
                  sleep 5
                done
                if [[ -z $gateway_service ]]; then
                  echo "Gateway controller did not create a Service before the timeout" >&2
                  return 1
                fi

                for route_name in api-monetization api-monetization-jwt; do
                  echo "binding OpenShift Route $route_name to Service $gateway_service"
                  retry_api patch route "$route_name" --type=merge \
                    --patch "{\"spec\":{\"to\":{\"name\":\"$gateway_service\"}}}"
                done
              }

              align_route() {
                local host=$1
                local http_route=$2

                echo "aligning HTTPRoute $http_route with https://$host"
                retry_api patch httproute "$http_route" \
                  -n api-monetization-apps \
                  --type=merge \
                  --patch "{\"spec\":{\"hostnames\":[\"$host\"]}}"
              }

              publish_openapi() {
                local host=$1
                local product=$2
                local configmap="${product}-api-openapi"
                local deployment="${product}-api"
                local openapi_document=""
                local current_url
                local rollout_state
                local generation
                local observed_generation
                local desired_replicas
                local updated_replicas
                local available_replicas

                for _ in $(seq 1 60); do
                  openapi_document=$(api get configmap "$configmap" \
                    -n api-monetization-apps \
                    -o go-template='{{index .data "openapi.yaml"}}' 2>/dev/null || true)
                  [[ -n $openapi_document ]] && break
                  sleep 5
                done
                if [[ -z $openapi_document ]]; then
                  echo "ConfigMap $configmap was not ready before the timeout" >&2
                  return 1
                fi

                current_url=$(sed -n 's/^  - url: //p' <<<"$openapi_document" | head -n 1)
                if [[ $current_url == "https://$host" ]]; then
                  echo "OpenAPI server URL is already https://$host"
                  return 0
                fi

                printf '%s\n' "$openapi_document" > /tmp/openapi.yaml
                sed -i "s#^  - url: .*\$#  - url: https://$host#" /tmp/openapi.yaml
                if ! grep -Fxq "  - url: https://$host" /tmp/openapi.yaml; then
                  echo "error: OpenAPI document has no replaceable server URL" >&2
                  return 1
                fi
                {
                  printf 'data:\n'
                  printf '  openapi.yaml: |-\n'
                  sed 's/^/    /' /tmp/openapi.yaml
                } > /tmp/openapi-patch.yaml

                echo "publishing OpenAPI server URL https://$host"
                retry_api patch configmap "$configmap" \
                  -n api-monetization-apps \
                  --type=merge \
                  --patch-file=/tmp/openapi-patch.yaml
                retry_api rollout restart deployment/"$deployment" \
                  -n api-monetization-apps

                for _ in $(seq 1 60); do
                  rollout_state=$(api get deployment "$deployment" \
                    -n api-monetization-apps \
                    -o jsonpath='{.metadata.generation}{"|"}{.status.observedGeneration}{"|"}{.spec.replicas}{"|"}{.status.updatedReplicas}{"|"}{.status.availableReplicas}' \
                    2>/dev/null || true)
                  IFS='|' read -r generation observed_generation desired_replicas updated_replicas available_replicas <<<"$rollout_state"
                  if [[ -n $generation && $observed_generation == "$generation" && \
                    $updated_replicas == "$desired_replicas" && \
                    $available_replicas == "$desired_replicas" ]]; then
                    echo "$deployment is serving the updated OpenAPI document"
                    return 0
                  fi
                  sleep 5
                done

                echo "$deployment rollout did not complete before the timeout" >&2
                return 1
              }

              bind_routes_to_gateway_service
              api_hostname=$(route_host api-monetization)
              jwt_hostname=$(route_host api-monetization-jwt)
              align_route "$api_hostname" inventory-api-key
              align_route "$jwt_hostname" inventory-jwt
              align_route "$api_hostname" payments-api-key
              align_route "$jwt_hostname" payments-jwt
              publish_openapi "$api_hostname" inventory
              publish_openapi "$api_hostname" payments
          resources:
            requests:
              cpu: 10m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            runAsNonRoot: true
            seccompProfile:
              type: RuntimeDefault
