apiVersion: batch/v1
kind: Job
metadata:
  name: api-monetization-route-host-migration
  namespace: api-monetization-gateway
  annotations:
    argocd.argoproj.io/hook: Sync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation,HookSucceeded
    argocd.argoproj.io/sync-wave: "9"
  labels:
    app.kubernetes.io/name: api-monetization-route-host-migration
    app.kubernetes.io/part-of: api-monetization
spec:
  activeDeadlineSeconds: 180
  backoffLimit: 2
  template:
    metadata:
      annotations:
        sidecar.istio.io/inject: "false"
      labels:
        app.kubernetes.io/name: api-monetization-route-host-migration
        app.kubernetes.io/part-of: api-monetization
    spec:
      restartPolicy: Never
      serviceAccountName: api-monetization-route-hosts
      containers:
        - name: migrate
          image: registry.redhat.io/openshift4/ose-cli-rhel9:v4.22
          imagePullPolicy: IfNotPresent
          command:
            - /bin/bash
            - -Eeuo
            - pipefail
            - -c
            - |
              api() {
                timeout -k 2s 8s oc --cache-dir=/tmp/.kube/cache --request-timeout=5s "$@"
              }

              retry_api() {
                local attempt
                for attempt in $(seq 1 6); do
                  if api "$@"; then
                    return 0
                  fi
                  if (( attempt < 6 )); then
                    echo "API request failed on attempt $attempt/6; retrying" >&2
                    sleep 5
                  fi
                done
                return 1
              }

              migrate_route() {
                local route_name=$1
                local old_host=$2
                local current_host

                current_host=$(api get route "$route_name" -o jsonpath='{.spec.host}' 2>/dev/null || true)
                if [[ $current_host == "$old_host" ]]; then
                  echo "removing legacy Route $route_name with host $old_host"
                  retry_api delete route "$route_name" --wait=true --timeout=60s
                fi
              }

              migrate_route api-monetization api-monetization.demo
              migrate_route api-monetization-jwt jwt.api-monetization.demo
          resources:
            requests:
              cpu: 10m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            runAsNonRoot: true
            seccompProfile:
              type: RuntimeDefault
---
apiVersion: batch/v1
kind: Job
metadata:
  name: api-monetization-route-hosts
  namespace: api-monetization-gateway
  annotations:
    argocd.argoproj.io/hook: Sync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation,HookSucceeded
    argocd.argoproj.io/sync-wave: "20"
  labels:
    app.kubernetes.io/name: api-monetization-route-hosts
    app.kubernetes.io/part-of: api-monetization
spec:
  activeDeadlineSeconds: 600
  backoffLimit: 2
  template:
    metadata:
      annotations:
        sidecar.istio.io/inject: "false"
      labels:
        app.kubernetes.io/name: api-monetization-route-hosts
        app.kubernetes.io/part-of: api-monetization
    spec:
      restartPolicy: Never
      serviceAccountName: api-monetization-route-hosts
      containers:
        - name: align
          image: registry.redhat.io/openshift4/ose-cli-rhel9:v4.22
          imagePullPolicy: IfNotPresent
          command:
            - /bin/bash
            - -Eeuo
            - pipefail
            - -c
            - |
              api() {
                timeout -k 2s 8s oc --cache-dir=/tmp/.kube/cache --request-timeout=5s "$@"
              }

              retry_api() {
                local attempt
                for attempt in $(seq 1 6); do
                  if api "$@"; then
                    return 0
                  fi
                  if (( attempt < 6 )); then
                    echo "API request failed on attempt $attempt/6; retrying" >&2
                    sleep 5
                  fi
                done
                return 1
              }

              route_host() {
                local route_name=$1
                local host
                local admitted

                for _ in $(seq 1 60); do
                  host=$(api get route "$route_name" -o jsonpath='{.status.ingress[0].host}' 2>/dev/null || true)
                  admitted=$(api get route "$route_name" -o jsonpath='{.status.ingress[0].conditions[?(@.type=="Admitted")].status}' 2>/dev/null || true)
                  if [[ -n $host && $admitted == True ]]; then
                    printf '%s' "$host"
                    return 0
                  fi
                  sleep 5
                done

                echo "Route $route_name was not admitted before the timeout" >&2
                return 1
              }

              align_route() {
                local route_name=$1
                local http_route=$2
                local host

                host=$(route_host "$route_name")
                echo "aligning HTTPRoute $http_route with http://$host"
                retry_api patch httproute "$http_route" \
                  -n api-monetization-apps \
                  --type=merge \
                  --patch "{\"spec\":{\"hostnames\":[\"$host\"]}}"
              }

              align_route api-monetization inventory-api-key
              align_route api-monetization-jwt inventory-jwt
          resources:
            requests:
              cpu: 10m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            runAsNonRoot: true
            seccompProfile:
              type: RuntimeDefault
