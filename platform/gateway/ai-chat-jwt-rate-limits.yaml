apiVersion: kuadrant.io/v1
kind: RateLimitPolicy
metadata:
  name: ai-chat-jwt-plans
  namespace: api-monetization-apps
  annotations: {argocd.argoproj.io/sync-wave: "30"}
  labels: {app.kubernetes.io/part-of: api-monetization}
spec:
  targetRef: {group: gateway.networking.k8s.io, kind: HTTPRoute, name: ai-chat-jwt}
  limits:
    free:
      rates: [{limit: 10, window: 1m}]
      counters: [{expression: auth.kuadrant.customer}]
      when: [{predicate: 'auth.kuadrant.plan == "free"'}]
    payg:
      rates: [{limit: 100, window: 1m}]
      counters: [{expression: auth.kuadrant.customer}]
      when: [{predicate: 'auth.kuadrant.plan == "payg"'}]
    developer:
      rates: [{limit: 1000, window: 1m}]
      counters: [{expression: auth.kuadrant.customer}]
      when: [{predicate: 'auth.kuadrant.plan == "developer"'}]
    business:
      rates: [{limit: 10000, window: 1m}]
      counters: [{expression: auth.kuadrant.customer}]
      when: [{predicate: 'auth.kuadrant.plan == "business"'}]
