apiVersion: devportal.kuadrant.io/v1alpha1
kind: APIProduct
metadata:
  name: inventory-api
  namespace: api-monetization-apps
  annotations:
    argocd.argoproj.io/sync-wave: "40"
  labels:
    app.kubernetes.io/part-of: api-monetization
spec:
  displayName: Inventory API
  description: Product and stock availability API used by the monetization demonstration.
  version: v1
  approvalMode: automatic
  publishStatus: Published
  targetRef:
    group: gateway.networking.k8s.io
    kind: HTTPRoute
    name: inventory-api-key
  tags:
    - inventory
    - monetized
    - demo
  contact:
    team: API Platform
    email: api-platform@example.invalid
  documentation:
    docsURL: https://github.com/arencloud/api-monetization-demo/blob/main/docs/demo-runbook.md
    openAPISpecURL: https://raw.githubusercontent.com/arencloud/api-monetization-demo/main/applications/inventory/openapi.yaml
    gitRepository: https://github.com/arencloud/api-monetization-demo
