apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: payments-api-key
  namespace: api-monetization-apps
  annotations:
    argocd.argoproj.io/sync-wave: "10"
  labels:
    app.kubernetes.io/name: payments-api
    app.kubernetes.io/part-of: api-monetization
    deployment: payments-api
    service: payments-api
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: api-monetization
      namespace: api-monetization-gateway
      sectionName: http
  hostnames: [api-monetization.invalid]
  rules:
    - name: payments
      matches:
        - method: GET
          path: {type: PathPrefix, value: /payments}
      filters:
        - type: ResponseHeaderModifier
          responseHeaderModifier:
            set:
              - {name: Access-Control-Allow-Origin, value: "*"}
              - {name: Access-Control-Expose-Headers, value: "X-Monetization-Billable-Units, X-RateLimit-Limit, X-RateLimit-Remaining, X-RateLimit-Reset"}
      backendRefs:
        - group: ""
          kind: Service
          name: payments-api
          port: 8080
          weight: 1
---
