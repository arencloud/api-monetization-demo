apiVersion: devportal.kuadrant.io/v1alpha1
kind: APIProduct
metadata:
  name: ai-chat-api-jwt
  namespace: api-monetization-apps
  annotations:
    argocd.argoproj.io/sync-wave: "40"
    backstage.io/owner: group:default/api-owners
    monetization.arencloud.com/product: ai-chat
  labels:
    app.kubernetes.io/part-of: api-monetization
spec:
  displayName: AI Chat API (Keycloak JWT)
