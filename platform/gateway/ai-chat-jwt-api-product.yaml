  publishStatus: Published
  targetRef: {group: gateway.networking.k8s.io, kind: HTTPRoute, name: ai-chat-jwt}
  tags: [ai, chat, token-metered, oidc, keycloak, monetized, demo]
  contact: {team: API Platform, email: api-platform@example.invalid}
  documentation:
    docsURL: https://github.com/arencloud/api-monetization-demo/blob/main/docs/demo-runbook.md
    openAPISpecURL: http://ai-chat-api.api-monetization-apps.svc.cluster.local:8082/openapi/keycloak-jwt.yaml
    gitRepository: https://github.com/arencloud/api-monetization-demo
