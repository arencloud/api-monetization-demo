apiVersion: v1
kind: ServiceAccount
metadata:
  name: api-monetization-gateway-service-mode
  namespace: api-monetization-gateway
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
  labels:
    app.kubernetes.io/name: api-monetization-gateway-service-mode
    app.kubernetes.io/part-of: api-monetization
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: api-monetization-gateway-service-mode
  namespace: api-monetization-gateway
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
  labels:
    app.kubernetes.io/name: api-monetization-gateway-service-mode
    app.kubernetes.io/part-of: api-monetization
rules:
  - apiGroups:
      - gateway.networking.k8s.io
    resources:
      - gateways
    verbs:
      - get
      - list
      - patch
      - watch
      - delete
  - apiGroups:
      - ""
    resources:
      - services
    verbs:
      - get
      - list
      - watch
  - apiGroups:
      - networking.istio.io
    resources:
      - destinationrules
    verbs:
      - get
      - delete
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: api-monetization-gateway-service-mode
  namespace: api-monetization-gateway
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
  labels:
    app.kubernetes.io/name: api-monetization-gateway-service-mode
    app.kubernetes.io/part-of: api-monetization
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: api-monetization-gateway-service-mode
subjects:
  - kind: ServiceAccount
    name: api-monetization-gateway-service-mode
    namespace: api-monetization-gateway
---
apiVersion: batch/v1
kind: Job
metadata:
  name: api-monetization-gateway-class-migration
  namespace: api-monetization-gateway
  annotations:
    argocd.argoproj.io/hook: Sync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation,HookSucceeded
    argocd.argoproj.io/sync-wave: "-1"
  labels:
    app.kubernetes.io/name: api-monetization-gateway-class-migration
    app.kubernetes.io/part-of: api-monetization
spec:
  backoffLimit: 2
  activeDeadlineSeconds: 180
  template:
    metadata:
      annotations:
        sidecar.istio.io/inject: "false"
      labels:
        app.kubernetes.io/name: api-monetization-gateway-class-migration
        app.kubernetes.io/part-of: api-monetization
    spec:
      serviceAccountName: api-monetization-gateway-service-mode
      restartPolicy: Never
      containers:
        - name: migrate
          image: registry.redhat.io/openshift4/ose-cli-rhel9:v4.22
          imagePullPolicy: IfNotPresent
          command:
            - /bin/bash
            - -Eeuo
            - pipefail
            - -c
            - |
              namespace=api-monetization-gateway
              gateway=api-monetization
              current_class=$(oc get gateway "$gateway" -n "$namespace" \
                -o jsonpath='{.spec.gatewayClassName}' 2>/dev/null || true)

              if [[ -n $current_class && $current_class != "istio" ]]; then
                echo "recreating Gateway to migrate from $current_class to istio"
                oc delete gateway "$gateway" -n "$namespace" \
                  --wait=true --timeout=120s
              else
                echo "Gateway class migration is not required"
              fi

              if oc get destinationrule inventory-api-cross-mesh \
                -n "$namespace" >/dev/null 2>&1; then
                echo "removing the obsolete cross-mesh plaintext exception"
                oc delete destinationrule inventory-api-cross-mesh \
                  -n "$namespace" --wait=true --timeout=60s
              fi
          resources:
            requests:
              cpu: 10m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            runAsNonRoot: true
            seccompProfile:
              type: RuntimeDefault
---
apiVersion: batch/v1
kind: Job
metadata:
  name: api-monetization-gateway-service-mode
  namespace: api-monetization-gateway
  annotations:
    argocd.argoproj.io/hook: Sync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation,HookSucceeded
    argocd.argoproj.io/sync-wave: "0"
  labels:
    app.kubernetes.io/name: api-monetization-gateway-service-mode
    app.kubernetes.io/part-of: api-monetization
spec:
  backoffLimit: 2
  activeDeadlineSeconds: 900
  template:
    metadata:
      annotations:
        sidecar.istio.io/inject: "false"
      labels:
        app.kubernetes.io/name: api-monetization-gateway-service-mode
        app.kubernetes.io/part-of: api-monetization
    spec:
      serviceAccountName: api-monetization-gateway-service-mode
      restartPolicy: Never
      containers:
        - name: select-service-mode
          image: registry.redhat.io/openshift4/ose-cli-rhel9:v4.22
          imagePullPolicy: IfNotPresent
          command:
            - /bin/bash
            - -Eeuo
            - pipefail
            - -c
            - |
              namespace=api-monetization-gateway
              gateway=api-monetization

              api() {
                timeout -k 2s 8s oc --cache-dir=/tmp/.kube/cache \
                  --request-timeout=5s "$@"
              }

              retry_api() {
                local attempt
                for attempt in $(seq 1 6); do
                  if api "$@"; then
                    return 0
                  fi
                  if (( attempt < 6 )); then
                    echo "API request failed on attempt $attempt/6; retrying" >&2
                    sleep 5
                  else
                    echo "API request failed after 6 attempts" >&2
                  fi
                done
                return 1
              }

              echo "probing for a Service LoadBalancer provider"
              retry_api patch gateway "$gateway" -n "$namespace" --type=merge --patch \
                '{"metadata":{"annotations":{"networking.istio.io/service-type":null}}}'

              gateway_service=""
              service_type=""
              external_address=""
              for attempt in $(seq 1 30); do
                service_state=""
                if service_state=$(api get services -n "$namespace" \
                  -l "gateway.networking.k8s.io/gateway-name=$gateway,gateway.networking.k8s.io/gateway-class-name=istio" \
                  -o jsonpath='{range .items[*]}{.metadata.name}{"|"}{.spec.type}{"|"}{range .status.loadBalancer.ingress[*]}{.ip}{.hostname}{end}{end}' \
                  2>/dev/null); then
                  IFS='|' read -r gateway_service service_type external_address <<<"$service_state"
                  if [[ $service_type == "LoadBalancer" && -n $external_address ]]; then
                    break
                  fi
                fi
                if (( attempt % 10 == 0 )); then
                  echo "still waiting for an external address ($attempt/30 probes)"
                fi
                if (( attempt < 30 )); then
                  sleep 5
                fi
              done

              if [[ -z $gateway_service ]]; then
                echo "error: the Gateway controller did not create a Service" >&2
                exit 1
              fi

              if [[ -n $external_address ]]; then
                echo "LoadBalancer provider assigned $external_address; preserving the LoadBalancer Service"
              else
                echo "no external address was assigned; selecting the portable ClusterIP plus OpenShift Route mode"
                retry_api patch gateway "$gateway" -n "$namespace" --type=merge --patch \
                  '{"metadata":{"annotations":{"networking.istio.io/service-type":"ClusterIP"}}}'

                service_type=""
                for attempt in $(seq 1 12); do
                  service_type=$(api get service "$gateway_service" -n "$namespace" \
                    -o jsonpath='{.spec.type}' 2>/dev/null || true)
                  if [[ $service_type == "ClusterIP" ]]; then
                    break
                  fi
                  if (( attempt < 12 )); then
                    sleep 5
                  fi
                done
                if [[ $service_type != "ClusterIP" ]]; then
                  echo "error: the Gateway Service did not converge to ClusterIP" >&2
                  exit 1
                fi
              fi

              programmed=""
              for attempt in $(seq 1 12); do
                programmed=$(api get gateway "$gateway" -n "$namespace" \
                  -o jsonpath='{range .status.conditions[?(@.type=="Programmed")]}{.status}{end}' \
                  2>/dev/null || true)
                if [[ $programmed == "True" ]]; then
                  break
                fi
                if (( attempt < 12 )); then
                  sleep 5
                fi
              done
              if [[ $programmed != "True" ]]; then
                echo "error: the Gateway did not become Programmed" >&2
                retry_api get gateway "$gateway" -n "$namespace" \
                  -o jsonpath='{range .status.conditions[*]}{.type}{"="}{.status}{" reason="}{.reason}{" message="}{.message}{"\n"}{end}' \
                  >&2 || true
                exit 1
              fi

              echo "Gateway service mode is ready: service=$gateway_service type=$service_type"
          resources:
            requests:
              cpu: 10m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            runAsNonRoot: true
            seccompProfile:
              type: RuntimeDefault
