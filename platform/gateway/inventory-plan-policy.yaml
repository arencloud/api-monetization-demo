apiVersion: extensions.kuadrant.io/v1alpha1
kind: PlanPolicy
metadata:
  name: inventory-api-plans
  namespace: api-monetization-apps
  annotations:
    argocd.argoproj.io/sync-wave: "30"
  labels:
    app.kubernetes.io/part-of: api-monetization
spec:
  targetRef:
    group: gateway.networking.k8s.io
    kind: HTTPRoute
    name: inventory-api-key
  plans:
    - tier: enterprise
      predicate: >-
        has(auth.identity) && auth.identity.metadata.annotations["secret.kuadrant.io/plan-id"] == "enterprise"
      limits: {}
    - tier: business
      predicate: >-
        has(auth.identity) && auth.identity.metadata.annotations["secret.kuadrant.io/plan-id"] == "business"
      limits:
        monthly: 5000000
        custom:
          - limit: 10000
            window: 1m
    - tier: developer
      predicate: >-
        has(auth.identity) && auth.identity.metadata.annotations["secret.kuadrant.io/plan-id"] == "developer"
      limits:
        monthly: 100000
        custom:
          - limit: 1000
            window: 1m
    - tier: free
      predicate: >-
        has(auth.identity) && auth.identity.metadata.annotations["secret.kuadrant.io/plan-id"] == "free"
      limits:
        monthly: 1000
        custom:
          - limit: 10
            window: 1m
