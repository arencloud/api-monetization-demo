apiVersion: kuadrant.io/v1
kind: AuthPolicy
metadata:
  name: inventory-api-key
  namespace: api-monetization-apps
  annotations:
    argocd.argoproj.io/sync-wave: "20"
  labels:
    app.kubernetes.io/part-of: api-monetization
spec:
  targetRef:
    group: gateway.networking.k8s.io
    kind: HTTPRoute
    name: inventory-api-key
  rules:
    authentication:
      api-key:
        apiKey:
          selector:
            matchLabels:
              devportal.kuadrant.io/apiproduct: inventory-api
          allNamespaces: true
        credentials:
          authorizationHeader:
            prefix: APIKEY
    metadata:
      subscription:
        http:
          method: GET
          urlExpression: >-
            'http://monetization-control.api-monetization-data.svc.cluster.local:8081/internal/entitlements/' +
            auth.identity.metadata.annotations['secret.kuadrant.io/user-id'] + '/inventory'
    authorization:
      active-subscription:
        patternMatching:
          patterns:
            - selector: auth.metadata.subscription.status
              operator: eq
              value: active
    response:
      success:
        headers:
          x-monetization-customer:
            plain:
              selector: auth.identity.metadata.annotations.secret\.kuadrant\.io/user-id
          x-monetization-plan:
            plain:
              selector: auth.metadata.subscription.plan
      unauthenticated:
        code: 401
        headers:
          content-type:
            value: application/json
        body:
          value: '{"error":"valid API key required"}'
      unauthorized:
        code: 403
        headers:
          content-type:
            value: application/json
        body:
          value: '{"error":"active subscription required"}'
---
apiVersion: kuadrant.io/v1
kind: AuthPolicy
metadata:
  name: inventory-jwt
  namespace: api-monetization-apps
  annotations:
    argocd.argoproj.io/sync-wave: "20"
  labels:
    app.kubernetes.io/part-of: api-monetization
spec:
  targetRef:
    group: gateway.networking.k8s.io
    kind: HTTPRoute
    name: inventory-jwt
  rules:
    authentication:
      keycloak:
        jwt:
          issuerUrl: http://api-monetization-service.api-monetization-identity.svc.cluster.local:8080/realms/api-monetization
    authorization:
      api-audience:
        patternMatching:
          patterns:
            - selector: auth.identity.aud
              operator: incl
              value: api-monetization
      active-subscription:
        patternMatching:
          patterns:
            - selector: auth.metadata.subscription.status
              operator: eq
              value: active
    metadata:
      subscription:
        http:
          method: GET
          urlExpression: >-
            'http://monetization-control.api-monetization-data.svc.cluster.local:8081/internal/entitlements/token/' +
            auth.identity.sub + '/' + auth.identity.azp + '/inventory'
    response:
      success:
        filters:
          kuadrant:
            json:
              properties:
                customer:
                  selector: auth.metadata.subscription.customerId
                plan:
                  selector: auth.metadata.subscription.plan
        headers:
          x-monetization-customer:
            plain:
              selector: auth.metadata.subscription.customerId
          x-monetization-plan:
            plain:
              selector: auth.metadata.subscription.plan
      unauthenticated:
        code: 401
        headers:
          content-type:
            value: application/json
        body:
          value: '{"error":"valid Keycloak bearer token required"}'
      unauthorized:
        code: 403
        headers:
          content-type:
            value: application/json
        body:
          value: '{"error":"token audience and active subscription are required"}'
