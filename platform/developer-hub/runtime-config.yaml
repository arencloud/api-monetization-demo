subjects:
  - kind: ServiceAccount
    name: api-monetization-rhdh-config
    namespace: api-monetization-developer-hub
---
apiVersion: batch/v1
kind: Job
metadata:
  name: api-monetization-rhdh-runtime-config
  namespace: api-monetization-developer-hub
  annotations:
    argocd.argoproj.io/hook: Sync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation,HookSucceeded
    argocd.argoproj.io/sync-wave: "-2"
  labels:
    app.kubernetes.io/part-of: api-monetization
spec:
  activeDeadlineSeconds: 1800
  backoffLimit: 2
  template:
    metadata:
      annotations:
        sidecar.istio.io/inject: "false"
    spec:
      serviceAccountName: api-monetization-rhdh-config
      restartPolicy: Never
      containers:
        - name: discover
          image: registry.redhat.io/openshift4/ose-cli-rhel9:v4.22
          imagePullPolicy: IfNotPresent
          command: [/bin/bash, -Eeuo, pipefail, -c]
          args:
            - |
              apps_domain=""
              keycloak_hostname=""
              devspaces_url=""
              devspaces_phase=""
              for _ in $(seq 1 300); do
                apps_domain=$(oc get ingress.config.openshift.io cluster \
                  -o jsonpath='{.spec.domain}' 2>/dev/null || true)
                keycloak_hostname=$(oc get route api-monetization-keycloak \
                  -n api-monetization-identity \
                  -o jsonpath='{.status.ingress[0].host}' 2>/dev/null || true)
                devspaces_url=$(oc get checluster devspaces \
                  -n openshift-devspaces \
                  -o jsonpath='{.status.cheURL}' 2>/dev/null || true)
                devspaces_phase=$(oc get checluster devspaces \
                  -n openshift-devspaces \
                  -o jsonpath='{.status.chePhase}' 2>/dev/null || true)
                [[ -n $apps_domain && -n $keycloak_hostname && \
                  -n $devspaces_url && $devspaces_phase == Active ]] && break
                sleep 5
              done
              if [[ -z $apps_domain || -z $keycloak_hostname || \
                -z $devspaces_url || $devspaces_phase != Active ]]; then
                echo "OpenShift ingress, Keycloak, or Dev Spaces was not ready" >&2
                exit 1
              fi

              rhdh_base_url="https://developer-hub.$apps_domain"
              keycloak_server_url="https://$keycloak_hostname"
              oc get secret router-ca -n openshift-ingress-operator \
                -o go-template='{{index .data "tls.crt"}}' \
                | base64 -d >/tmp/router-ca.crt
              printf '\n' >>/tmp/router-ca.crt
              cat /var/run/secrets/kubernetes.io/serviceaccount/ca.crt \
                >>/tmp/router-ca.crt
              oc create configmap api-monetization-rhdh-router-ca \
                --from-file=router-ca.crt=/tmp/router-ca.crt \
                --dry-run=client -o yaml \
                | oc apply --server-side --field-manager=api-monetization-rhdh-config -f -
              oc create secret generic api-monetization-rhdh-runtime-config \
                --from-literal="RHDH_BASE_URL=$rhdh_base_url" \
                --from-literal="DEV_SPACES_URL=$devspaces_url" \
                --from-literal="KEYCLOAK_SERVER_URL=$keycloak_server_url" \
                --from-literal="KEYCLOAK_BASE_URL=$keycloak_server_url/realms/api-monetization" \
                --dry-run=client -o yaml \
                | oc apply --server-side --field-manager=api-monetization-rhdh-config -f -
              echo "Developer Hub URL is $rhdh_base_url"
              echo "OpenShift Dev Spaces URL is $devspaces_url"
          resources:
            requests: {cpu: 10m, memory: 64Mi}
            limits: {cpu: 200m, memory: 256Mi}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: [ALL]}
            runAsNonRoot: true
            seccompProfile: {type: RuntimeDefault}
