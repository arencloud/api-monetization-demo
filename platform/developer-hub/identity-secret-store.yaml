apiVersion: v1
kind: ServiceAccount
metadata:
  name: api-monetization-rhdh-secret-reader
  namespace: api-monetization-developer-hub
  annotations:
    argocd.argoproj.io/sync-wave: "-6"
  labels:
    app.kubernetes.io/part-of: api-monetization
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: api-monetization-rhdh-client-reader
  namespace: api-monetization-identity
  annotations:
    argocd.argoproj.io/sync-wave: "-6"
  labels:
    app.kubernetes.io/part-of: api-monetization
rules:
  - apiGroups: [""]
    resources: [secrets]
    resourceNames: [rhdh-keycloak-client]
    verbs: [get]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: api-monetization-rhdh-client-reader
  namespace: api-monetization-identity
  annotations:
    argocd.argoproj.io/sync-wave: "-6"
  labels:
    app.kubernetes.io/part-of: api-monetization
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: api-monetization-rhdh-client-reader
subjects:
  - kind: ServiceAccount
    name: api-monetization-rhdh-secret-reader
    namespace: api-monetization-developer-hub
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: api-monetization-rhdh-secret-store-reviewer
  annotations:
    argocd.argoproj.io/sync-wave: "-6"
  labels:
    app.kubernetes.io/part-of: api-monetization
rules:
  - apiGroups: [authorization.k8s.io]
    resources: [selfsubjectrulesreviews]
    verbs: [create]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: api-monetization-rhdh-secret-store-reviewer
  annotations:
    argocd.argoproj.io/sync-wave: "-6"
  labels:
    app.kubernetes.io/part-of: api-monetization
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: api-monetization-rhdh-secret-store-reviewer
subjects:
  - kind: ServiceAccount
    name: api-monetization-rhdh-secret-reader
    namespace: api-monetization-developer-hub
---
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: api-monetization-identity
  namespace: api-monetization-developer-hub
  annotations:
    argocd.argoproj.io/sync-wave: "-5"
  labels:
    app.kubernetes.io/part-of: api-monetization
spec:
  provider:
    kubernetes:
      remoteNamespace: api-monetization-identity
      server:
        url: https://kubernetes.default.svc
        caProvider:
          type: ConfigMap
          name: kube-root-ca.crt
          key: ca.crt
      auth:
        serviceAccount:
          name: api-monetization-rhdh-secret-reader
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: api-monetization-rhdh-keycloak
  namespace: api-monetization-developer-hub
  annotations:
    argocd.argoproj.io/sync-wave: "-4"
  labels:
    app.kubernetes.io/part-of: api-monetization
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: SecretStore
    name: api-monetization-identity
  target:
    name: api-monetization-rhdh-keycloak
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      engineVersion: v2
      data:
        KEYCLOAK_CLIENT_ID: rhdh
        KEYCLOAK_CLIENT_SECRET: "{{ .clientSecret }}"
        KEYCLOAK_REALM: api-monetization
        KEYCLOAK_LOGIN_REALM: api-monetization
  data:
    - secretKey: clientSecret
      remoteRef:
        key: rhdh-keycloak-client
        property: client-secret
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
        nullBytePolicy: Ignore
