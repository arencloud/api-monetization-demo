app:
  title: API Monetization Developer Hub
  baseUrl: ${RHDH_BASE_URL}
  branding:
    fullLogo: data:image/svg+xml;base64,
    iconLogo: data:image/svg+xml;base64,

organization:
  name: API Monetization

backend:
  baseUrl: ${RHDH_BASE_URL}
  cors:
    origin: ${RHDH_BASE_URL}
    methods: [GET, HEAD, PATCH, POST, PUT, DELETE]
    credentials: true
  auth:
    externalAccess:
      - type: legacy
        options:
          subject: legacy-default-config
          secret: ${BACKEND_SECRET}
  database:
    client: pg
    pluginDivisionMode: schema
    connection:
      host: ${POSTGRES_HOST}
      port: ${POSTGRES_PORT}
      user: ${POSTGRES_USER}
      password: ${POSTGRES_PASSWORD}
      database: ${POSTGRES_DB}
      ssl:
        rejectUnauthorized: false

auth:
  environment: production
  session:
    secret: ${SESSION_SECRET}
  providers:
    oidc:
      production:
        metadataUrl: ${KEYCLOAK_BASE_URL}
        clientId: ${KEYCLOAK_CLIENT_ID}
        clientSecret: ${KEYCLOAK_CLIENT_SECRET}
        prompt: auto
        signIn:
          resolvers:
            - resolver: oidcSubClaimMatchingKeycloakUserId

kubernetes:
  serviceLocatorMethod:
    type: multiTenant
  clusterLocatorMethods:
    - type: config
      clusters:
        - name: openshift
          title: API Monetization OpenShift
          url: https://kubernetes.default.svc
          authProvider: serviceAccount
          # Kuadrant 0.4.0 requires this explicit field when the Kubernetes
          # backend also uses a config locator. Kubernetes generates the
          # credential in-cluster; no token value is stored in Git.
          serviceAccountToken: ${K8S_SERVICE_ACCOUNT_TOKEN}
          skipTLSVerify: false
          skipMetricsLookup: true
          dashboardApp: openshift
  customResources:
    - group: route.openshift.io
      apiVersion: v1
      plural: routes
    - group: org.eclipse.che
      apiVersion: v2
      plural: checlusters

integrations:
  github:
    - host: github.com

catalog:
  rules:
    - allow:
        - API
        - APIProduct
        - Component
        - Domain
        - Group
        - Location
        - Resource
        - System
        - Template
        - User
  providers:
    keycloakOrg:
      default:
        baseUrl: ${KEYCLOAK_SERVER_URL}
        loginRealm: ${KEYCLOAK_LOGIN_REALM}
        realm: ${KEYCLOAK_REALM}
        clientId: ${KEYCLOAK_CLIENT_ID}
        clientSecret: ${KEYCLOAK_CLIENT_SECRET}
        schedule:
          # RHDH's base configuration supplies a 60-minute default. Config
          # objects are deep-merged, so explicitly clear that minute field;
          # otherwise {seconds: 10} becomes an effective PT60M10S cadence.
          # Keep registration usable without bypassing catalog-backed RBAC.
          frequency: {minutes: 0, seconds: 10}
          initialDelay: {seconds: 5}
          timeout: {minutes: 1}
  locations:
    - type: url
      target: https://github.com/arencloud/api-monetization-demo/blob/${GITOPS_SOURCE_REVISION}/golden-paths/api-interface/template.yaml
      rules:
        - allow: [Template]
    - type: url
      target: https://github.com/arencloud/api-monetization-demo/blob/${GITOPS_SOURCE_REVISION}/golden-paths/camel-api-integration/template.yaml
      rules:
        - allow: [Template]

scaffolder:
  defaultAuthor:
    name: API Monetization Developer Hub
    email: api-platform@example.invalid
  defaultCommitMessage: Bootstrap from an API-owner Golden Path
  defaultEnvironment:
    parameters:
      devSpacesBaseUrl: ${DEV_SPACES_URL}

permission:
  enabled: true
  rbac:
    conditionalPoliciesFile: /opt/app-root/etc/rbac-conditional-policies.yaml
    policies-csv-file: /opt/app-root/etc/rbac-policy.csv
    policyFileReload: true

dynamicPlugins:
  frontend:
    default.main-menu-items:
      menuItems:
        default.apis:
          title: APIs
          icon: extension
          to: monetized-apis
          priority: 70
          enabled: true
        default.create:
          title: Golden Paths
          icon: add
          to: create
          priority: 65
          enabled: true

apiMonetization:
  controlBaseUrl: http://monetization-control.api-monetization-data.svc.cluster.local:8080
  devSpacesBaseUrl: ${DEV_SPACES_URL}
  publication:
    githubOwner: arencloud
