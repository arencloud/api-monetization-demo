apiVersion: generators.external-secrets.io/v1alpha1
kind: Password
metadata:
  name: api-monetization-rhdh-db-password
  namespace: api-monetization-developer-hub
  annotations:
    argocd.argoproj.io/sync-wave: "-5"
  labels:
    app.kubernetes.io/part-of: api-monetization
spec:
  length: 40
  digits: 8
  symbols: 8
  symbolCharacters: -_!@#%
  allowRepeat: true
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: api-monetization-rhdh-db
  namespace: api-monetization-developer-hub
  annotations:
    argocd.argoproj.io/sync-wave: "-4"
  labels:
    app.kubernetes.io/part-of: api-monetization
spec:
  refreshPolicy: CreatedOnce
  target:
    name: api-monetization-rhdh-db
    creationPolicy: Orphan
    immutable: true
    template:
      engineVersion: v2
      type: kubernetes.io/basic-auth
      data:
        username: rhdh
        password: "{{ .password }}"
        POSTGRES_USER: rhdh
        POSTGRES_PASSWORD: "{{ .password }}"
        POSTGRES_HOST: api-monetization-rhdh-postgres-rw
        POSTGRES_PORT: "5432"
        POSTGRES_DB: rhdh
        PGSSLMODE: require
  dataFrom:
    - sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: Password
          name: api-monetization-rhdh-db-password
---
apiVersion: generators.external-secrets.io/v1alpha1
kind: Password
metadata:
  name: api-monetization-rhdh-runtime-passwords
  namespace: api-monetization-developer-hub
  annotations:
    argocd.argoproj.io/sync-wave: "-5"
  labels:
    app.kubernetes.io/part-of: api-monetization
spec:
  length: 48
  digits: 8
  symbols: 0
  allowRepeat: true
  secretKeys:
    - generated
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: api-monetization-rhdh-runtime-secrets
  namespace: api-monetization-developer-hub
  annotations:
    argocd.argoproj.io/sync-wave: "-4"
  labels:
    app.kubernetes.io/part-of: api-monetization
spec:
  refreshPolicy: CreatedOnce
  target:
    name: api-monetization-rhdh-runtime-secrets
    creationPolicy: Orphan
    immutable: true
    template:
      engineVersion: v2
      data:
        BACKEND_SECRET: "{{ .generated }}"
        SESSION_SECRET: "{{ .generated }}"
  dataFrom:
    - sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: Password
          name: api-monetization-rhdh-runtime-passwords
