includes:
  - dynamic-plugins.default.yaml
plugins:
  - package: ./dynamic-plugins/dist/backstage-plugin-scaffolder-backend-module-github-dynamic
    disabled: false
  - package: ./dynamic-plugins/dist/backstage-plugin-kubernetes-backend-dynamic
    disabled: false
  - package: ./dynamic-plugins/dist/backstage-plugin-kubernetes
    disabled: false
  - package: ./dynamic-plugins/dist/backstage-community-plugin-topology
    disabled: false
    pluginConfig:
      dynamicPlugins:
        frontend:
          backstage-community.plugin-topology:
            translationResources:
              - importName: topologyTranslations
                ref: topologyTranslationRef
                module: Alpha
            mountPoints:
              - mountPoint: entity.page.topology/cards
                importName: TopologyPage
                config:
                  layout: {gridColumn: "1 / -1", height: 75vh}
                  if:
                    anyOf:
                      - hasAnnotation: backstage.io/kubernetes-id
                      - hasAnnotation: backstage.io/kubernetes-label-selector
  - package: ./dynamic-plugins/dist/backstage-community-plugin-catalog-backend-module-keycloak-dynamic
    disabled: false
  - package: ./dynamic-plugins/dist/backstage-community-plugin-rbac
    disabled: false
    pluginConfig:
      dynamicPlugins:
        frontend:
          backstage-community.plugin-rbac:
            mountPoints:
              - mountPoint: admin.page.rbac/cards
                importName: RbacPage
                config:
                  layout: {gridColumn: "1 / -1", width: 100vw}
                  props: {useHeader: false}
            dynamicRoutes:
              - path: /admin/rbac
                importName: RbacPage
  - package: "@kuadrant/kuadrant-backstage-plugin-backend-dynamic@v0.4.0"
    integrity: sha512-OOkfAbnFxuOkBjvQMUqkd/TtP/yrXr15yQ/Xel880kdgZk39CPlQzVdOS3VXmcLa/Y9toI9nTbyCNqtXAD2C/g==
    disabled: false
  - package: "@kuadrant/kuadrant-backstage-plugin-frontend@v0.4.0"
    integrity: sha512-ewW/eOoHcK8MqmhyGzFQvnU8yQkvRpQxhb/GLZbAyWwWpmA/zju2qwFWXx49eBcy9RIlfO2rwS8sQC7do3dfGA==
    disabled: false
    pluginConfig:
      dynamicPlugins:
        frontend:
          internal.plugin-kuadrant:
            apiFactories:
              - importName: kuadrantApiFactory
            appIcons:
              - {name: kuadrantIcon, importName: KuadrantIcon}
            dynamicRoutes:
              - path: /kuadrant
                importName: KuadrantPage
              - path: /kuadrant/api-products/:namespace/:name
                importName: ApiProductDetailPage
            mountPoints:
              - mountPoint: entity.page.api/cards
                importName: EntityKuadrantApiProductInfoContent
                config:
                  layout: {gridColumn: "1 / -1"}
                  if: {allOf: [{isKind: api}]}
  - package: /opt/app-root/src/local-plugins/arencloud-rhdh-monetization-backend-dynamic-0.1.6.tgz
    integrity: sha512-1a+Cs5HcdNYCGjsHwObx4lDdvzrChbTz99CXXDuvUqZOEdIewShXDUJroRQ4F4s3U/FrZtUxWGeONGUdkkRuzg==
    disabled: false
  - package: /opt/app-root/src/local-plugins/arencloud-rhdh-policy-catalog-dynamic-0.1.9.tgz
    integrity: sha512-Z21GMaL/H8WWSuw5YV5hQSoE8ubDx0pS3YX+3hwNLHF/0cRGxbqJDviJ1tDERDzQXePGTG+LxpSZlV6jyKt9CA==
    disabled: false
    pluginConfig:
      dynamicPlugins:
        frontend:
          arencloud.rhdh-policy-catalog:
            apiFactories:
              - importName: oidcAuthApiFactory
            signInPage:
              importName: CustomSignInPage
            dynamicRoutes:
              - path: /kuadrant/api-products
                importName: ApiProductsPage
              - path: /billing
                importName: MonetizationPage
                menuItem: {icon: kuadrantIcon, text: Subscriptions & Access}
              - path: /monetized-apis
                importName: MonetizedApisPage
            mountPoints:
              - mountPoint: entity.page.overview/cards
                importName: EntityDevSpacesCard
                config:
                  layout: {gridColumn: "span 4"}
                  if:
                    allOf:
                      - isKind: component
                      - hasAnnotation: github.com/project-slug
