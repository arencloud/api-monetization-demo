apiVersion: generators.external-secrets.io/v1alpha1
kind: Password
metadata:
  name: keycloak-db-password
  namespace: api-monetization-identity
  labels:
    app.kubernetes.io/part-of: api-monetization
spec:
  length: 40
  digits: 8
  symbols: 8
  symbolCharacters: -_!@#%
  allowRepeat: true
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: keycloak-db-credentials
  namespace: api-monetization-identity
  labels:
    app.kubernetes.io/part-of: api-monetization
spec:
  refreshPolicy: CreatedOnce
  target:
    name: keycloak-db-credentials
    creationPolicy: Orphan
    immutable: true
    template:
      engineVersion: v2
      type: kubernetes.io/basic-auth
      data:
        username: keycloak
        password: "{{ .password }}"
  dataFrom:
    - sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: Password
          name: keycloak-db-password

