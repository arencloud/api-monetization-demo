apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: api-monetization-api-owners
  namespace: openshift-gitops
  annotations:
    argocd.argoproj.io/sync-wave: "-30"
  labels:
    app.kubernetes.io/part-of: api-monetization
spec:
  description: Reviewed API-owner workloads generated by Red Hat Developer Hub Golden Paths
  sourceRepos:
    - https://github.com/arencloud/*.git
  destinations:
    - server: https://kubernetes.default.svc
      namespace: api-monetization-apps
  namespaceResourceWhitelist:
    - {group: apps, kind: Deployment}
    - {group: '', kind: Service}
    - {group: image.openshift.io, kind: ImageStream}
    - {group: build.openshift.io, kind: BuildConfig}
    - {group: monitoring.coreos.com, kind: ServiceMonitor}
    - {group: gateway.networking.k8s.io, kind: HTTPRoute}
    - {group: kuadrant.io, kind: AuthPolicy}
    - {group: kuadrant.io, kind: RateLimitPolicy}
    - {group: extensions.kuadrant.io, kind: PlanPolicy}
    - {group: devportal.kuadrant.io, kind: APIProduct}
  orphanedResources:
    warn: true
