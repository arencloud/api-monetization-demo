apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: api-monetization-control
  namespace: openshift-gitops
  annotations:
    argocd.argoproj.io/sync-wave: "40"
  labels:
    app.kubernetes.io/part-of: api-monetization
spec:
  project: api-monetization
  source:
    repoURL: https://github.com/arencloud/api-monetization-demo.git
    targetRevision: main
    path: applications/control
    kustomize:
      commonAnnotations:
        api-monetization.demo/source-revision: ${ARGOCD_APP_REVISION}
      commonAnnotationsEnvsubst: true
  destination:
    server: https://kubernetes.default.svc
    namespace: api-monetization-data
  ignoreDifferences:
    - group: apps
      kind: Deployment
      name: monetization-control
      namespace: api-monetization-data
      jqPathExpressions:
        - .spec.template.spec.containers[] | select(.name == "monetization-control").image
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    retry:
      limit: 20
      backoff:
        duration: 15s
        factor: 2
        maxDuration: 3m
    syncOptions:
      - ServerSideApply=true
      - RespectIgnoreDifferences=true
