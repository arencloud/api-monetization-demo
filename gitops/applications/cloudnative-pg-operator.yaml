apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: api-monetization-cloudnative-pg-operator
  namespace: openshift-gitops
  annotations:
    argocd.argoproj.io/sync-wave: "-10"
  labels:
    app.kubernetes.io/part-of: api-monetization
spec:
  project: api-monetization
  source:
    repoURL: https://github.com/arencloud/api-monetization-demo.git
    targetRevision: main
    path: operators/cloudnative-pg
  destination:
    server: https://kubernetes.default.svc
    namespace: openshift-operators
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    retry:
      limit: 10
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 3m
    syncOptions:
      - ServerSideApply=true

