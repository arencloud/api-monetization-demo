apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: api-monetization-payments
  namespace: openshift-gitops
  annotations:
    argocd.argoproj.io/sync-wave: "40"
  labels:
    app.kubernetes.io/part-of: api-monetization
spec:
  project: api-monetization
  source:
    repoURL: https://github.com/arencloud/api-monetization-demo.git
    targetRevision: main
    path: applications/payments
    kustomize:
      commonAnnotations:
        api-monetization.demo/source-revision: ${ARGOCD_APP_REVISION}
      commonAnnotationsEnvsubst: true
  destination:
    server: https://kubernetes.default.svc
    namespace: api-monetization-apps
  ignoreDifferences:
    - group: apps
      kind: Deployment
      name: payments-api
      namespace: api-monetization-apps
      jsonPointers:
        - /spec/template/metadata/annotations/kubectl.kubernetes.io~1restartedAt
      jqPathExpressions:
        - .spec.template.spec.containers[] | select(.name == "payments-api").image
    - group: ""
      kind: ConfigMap
      name: payments-api-openapi-contracts
      namespace: api-monetization-apps
      jsonPointers:
        - /data/api-key.yaml
        - /data/keycloak-jwt.yaml
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    retry:
      limit: 20
      backoff:
        duration: 15s
        factor: 2
        maxDuration: 3m
    syncOptions:
      - ServerSideApply=true
      - RespectIgnoreDifferences=true
