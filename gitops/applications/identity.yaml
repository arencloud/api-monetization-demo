apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: api-monetization-identity
  namespace: openshift-gitops
  annotations:
    argocd.argoproj.io/sync-wave: "30"
  labels:
    app.kubernetes.io/part-of: api-monetization
spec:
  project: api-monetization
  source:
    repoURL: https://github.com/arencloud/api-monetization-demo.git
    targetRevision: main
    path: platform/identity
    kustomize:
      commonAnnotations:
        api-monetization.demo/source-revision: ${ARGOCD_APP_REVISION}
      commonAnnotationsEnvsubst: true
  destination:
    server: https://kubernetes.default.svc
    namespace: api-monetization-identity
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    retry:
      limit: 20
      backoff:
        duration: 15s
        factor: 2
        maxDuration: 3m
    syncOptions:
      - ServerSideApply=true
      - SkipDryRunOnMissingResource=true
