apiVersion: batch/v1
kind: Job
metadata:
  name: api-monetization-registry-initializer
  namespace: openshift-image-registry
  annotations:
    argocd.argoproj.io/hook: Sync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation,HookSucceeded
    argocd.argoproj.io/sync-wave: "-14"
  labels:
    app.kubernetes.io/name: api-monetization-registry-initializer
    app.kubernetes.io/part-of: api-monetization
spec:
  backoffLimit: 3
  activeDeadlineSeconds: 900
  template:
    metadata:
      labels:
        app.kubernetes.io/name: api-monetization-registry-initializer
        app.kubernetes.io/part-of: api-monetization
    spec:
      serviceAccountName: api-monetization-registry-initializer
      restartPolicy: Never
      containers:
        - name: initialize
          image: registry.redhat.io/openshift4/ose-cli-rhel9:v4.22
          imagePullPolicy: IfNotPresent
          command:
            - /bin/bash
            - -Eeuo
            - pipefail
            - -c
            - |
              registry_config=config.imageregistry.operator.openshift.io/cluster
              management_state=$(oc get "$registry_config" -o jsonpath='{.spec.managementState}')

              case "$management_state" in
                Managed)
                  echo "the integrated image registry is already Managed; preserving its configuration"
                  ;;
                Removed)
                  storage_entries=$(oc get "$registry_config" -o go-template='{{len .spec.storage}}')
                  if [[ $storage_entries == 0 ]]; then
                    echo "configuring non-production emptyDir registry storage"
                    oc patch "$registry_config" --type=merge --patch \
                      '{"metadata":{"annotations":{"api-monetization.io/registry-previous-state":"Removed","api-monetization.io/registry-storage-added":"emptyDir"}},"spec":{"replicas":1,"storage":{"emptyDir":{}}}}'
                  else
                    echo "preserving the registry storage that is already configured"
                    oc patch "$registry_config" --type=merge --patch \
                      '{"metadata":{"annotations":{"api-monetization.io/registry-previous-state":"Removed"}}}'
                  fi
                  oc patch "$registry_config" --type=merge --patch \
                    '{"spec":{"managementState":"Managed"}}'
                  ;;
                *)
                  echo "error: unsupported image registry managementState: $management_state" >&2
                  echo "set the registry to Managed or Removed before retrying the GitOps sync" >&2
                  exit 1
                  ;;
              esac

              for _ in $(seq 1 60); do
                if oc get deployment/image-registry -n openshift-image-registry \
                  >/dev/null 2>&1; then
                  break
                fi
                sleep 5
              done
              oc rollout status deployment/image-registry \
                -n openshift-image-registry --timeout=10m
          resources:
            requests:
              cpu: 10m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            runAsNonRoot: true
            seccompProfile:
              type: RuntimeDefault
