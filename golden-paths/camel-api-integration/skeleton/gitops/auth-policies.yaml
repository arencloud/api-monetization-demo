apiVersion: kuadrant.io/v1
kind: AuthPolicy
metadata:
  name: ${{ values.name }}-api-key
  namespace: api-monetization-apps
  annotations: {argocd.argoproj.io/sync-wave: "20"}
spec:
  targetRef: {group: gateway.networking.k8s.io, kind: HTTPRoute, name: '${{ values.name }}-api-key'}
  rules:
    authentication:
      api-key:
        apiKey:
          selector:
            matchLabels: {devportal.kuadrant.io/apiproduct: '${{ values.name }}-api'}
          allNamespaces: true
        credentials:
          authorizationHeader: {prefix: APIKEY}
    response:
      unauthenticated:
        code: 401
        headers: {content-type: {value: application/json}}
        body: {value: '{"error":"valid API key required"}'}
---
apiVersion: kuadrant.io/v1
kind: AuthPolicy
metadata:
  name: ${{ values.name }}-jwt
  namespace: api-monetization-apps
  annotations: {argocd.argoproj.io/sync-wave: "20"}
spec:
  targetRef: {group: gateway.networking.k8s.io, kind: HTTPRoute, name: '${{ values.name }}-jwt'}
  rules:
    authentication:
      keycloak:
        jwt:
          jwksUrl: http://api-monetization-service.api-monetization-identity.svc.cluster.local:8080/realms/api-monetization/protocol/openid-connect/certs
    authorization:
      keycloak-issuer:
        patternMatching:
          patterns:
            - {selector: auth.identity.iss, operator: matches, value: '^https://keycloak-api-monetization[.]apps[.][^/]+/realms/api-monetization$'}
      api-audience:
        patternMatching:
          patterns:
            - {selector: auth.identity.aud, operator: incl, value: api-monetization}
    response:
      unauthenticated:
        code: 401
        headers: {content-type: {value: application/json}}
        body: {value: '{"error":"valid Keycloak bearer token required"}'}
      unauthorized:
        code: 403
        headers: {content-type: {value: application/json}}
        body: {value: '{"error":"api-monetization audience required"}'}

