- route:
    id: ${{ values.name }}-mapping
    from:
      uri: platform-http:${{ values.apiPath }}
      parameters:
        httpMethodRestrict: POST
      steps:
        - unmarshal:
            json:
              library: Jackson
        - to: bean:canonicalMapping?method=map
        - marshal:
            json:
              library: Jackson
        - setHeader:
            name: Content-Type
            constant: application/json
        - to: bean:usageReporter?method=record
- route:
    id: ${{ values.name }}-browser-preflight
    from:
      uri: platform-http:${{ values.apiPath }}
      parameters:
        httpMethodRestrict: OPTIONS
      steps:
        - setHeader:
            name: CamelHttpResponseCode
            constant: "204"
        - setBody:
            constant: ""
