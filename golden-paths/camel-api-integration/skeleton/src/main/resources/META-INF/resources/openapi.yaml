openapi: 3.0.3
info:
  title: ${{ values.displayName }}
  version: 1.0.0
  description: ${{ values.description }}
servers:
  - url: https://api.example.invalid
    description: Replaced by the admitted Gateway API hostname after onboarding
paths:
  ${{ values.apiPath }}:
    post:
      operationId: map${{ values.name }}
      summary: Transform a partner payload into the canonical model
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
              properties:
                correlationId: {type: string}
                payload: {type: object, additionalProperties: true}
      responses:
        '200':
          description: Canonical payload
          content:
            application/json:
              schema:
                type: object
                required: [interface, payload, mappedAt]
                properties:
                  interface: {type: string}
                  correlationId: {type: string}
                  payload: {type: object, additionalProperties: true}
                  mappedAt: {type: string, format: date-time}
        '401': {description: A valid API key or Keycloak token is required}
        '429': {description: The selected plan limit has been reached}
components:
  securitySchemes:
    apiKey:
      type: apiKey
      in: header
      name: Authorization
      description: Use `APIKEY <credential>`.
    keycloak:
      type: openIdConnect
      openIdConnectUrl: https://keycloak.example.invalid/realms/api-monetization/.well-known/openid-configuration
security:
  - apiKey: []
  - keycloak: []

