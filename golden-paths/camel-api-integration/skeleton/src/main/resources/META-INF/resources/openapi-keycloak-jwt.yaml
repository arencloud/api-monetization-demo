openapi: 3.0.3
info:
  title: ${{ values.displayName }} (Keycloak JWT)
  version: 1.0.0
  description: ${{ values.description }}
servers:
  - url: https://jwt.api.example.invalid
    description: Keycloak JWT endpoint; replaced by the admitted Gateway API hostname during publication
paths:
  ${{ values.apiPath }}:
    post:
      operationId: map${{ values.name }}WithKeycloakJwt
      summary: Transform a partner payload using a Keycloak access token
      security:
        - keycloakBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
              properties:
                correlationId: {type: string}
                payload: {type: object, additionalProperties: true}
      responses:
        '200':
          description: Canonical payload
          content:
            application/json:
              schema:
                type: object
                required: [interface, payload, mappedAt]
                properties:
                  interface: {type: string}
                  correlationId: {type: string}
                  payload: {type: object, additionalProperties: true}
                  mappedAt: {type: string, format: date-time}
        '401': {description: A valid Keycloak bearer token is required}
        '403': {description: An active subscription is required}
        '429': {description: The selected plan limit has been reached}
components:
  securitySchemes:
    keycloakBearer:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: 'Paste the Keycloak access token. Swagger sends it as `Authorization: Bearer <token>`.'
