apiVersion: scaffolder.backstage.io/v1beta3
kind: Template
metadata:
  name: monetized-camel-api-integration
  title: Monetized Camel API integration
  description: Create a Red Hat Camel Quarkus mapping/orchestration API with RHCL plans and GitOps.
  annotations:
    backstage.io/techdocs-ref: dir:.
    backstage.io/template-version: 1.4.1
  tags:
    - api
    - camel
    - integration
    - kaoto
    - kuadrant
    - monetization
    - openshift
spec:
  owner: group:default/api-owners
  type: service
  parameters:
    - title: Integration API identity
      required: [name, displayName, description, apiPath, owner]
      properties:
        name:
          title: Project and product ID
          type: string
          description: Lowercase DNS-safe name used for the repository and Kubernetes resources.
          pattern: '^[a-z][a-z0-9-]{2,39}$'
          maxLength: 40
          ui:autofocus: true
        displayName:
          title: Display name
          type: string
          maxLength: 80
        description:
          title: Integration purpose
          type: string
          maxLength: 240
          ui:widget: textarea
          ui:options: {rows: 3}
        apiPath:
          title: Public API path
          type: string
          description: A unique Gateway API path beginning with a slash, for example /partner-orders.
          pattern: '^/[a-z0-9][a-z0-9/_-]*$'
          default: /integration
        owner:
          title: Catalog owner
          type: string
          default: group:default/api-owners
          ui:field: OwnerPicker
          ui:options:
            allowedKinds: [Group]
        lifecycle:
          title: Lifecycle
          type: string
          default: production
          enum: [experimental, production]
          enumNames: [Experimental, Production]
        approvalMode:
          title: Subscription approval
          type: string
          default: automatic
          enum: [automatic, manual]
          enumNames: [Automatic, Manual]
        publishStatus:
          title: API catalog status
          type: string
          description: Draft keeps the product unavailable until platform and commercial review is complete.
          default: Draft
          enum: [Draft, Published]
    - title: Billing model
      description: Choose the native billable unit. Request APIs bill one accepted request; AI integrations report their accepted token count.
      required: [billingUnit]
      properties:
        billingUnit: {title: Billable unit, type: string, default: request, enum: [request, token], enumNames: [Accepted API request, Accepted AI token]}
    - title: Free plan
      required:
        - freeMonthlyPriceCents
        - freeIncludedUnits
        - freeMonthlyQuota
        - freeRequestsPerMinute
        - freeOverageMicrosPerUnit
      properties:
        freeMonthlyPriceCents: {title: Monthly price in euro cents, type: integer, default: 0, minimum: 0}
        freeIncludedUnits: {title: Included billable units, type: integer, default: 1000, minimum: 0}
        freeRequestsPerMinute: {title: Gateway requests per minute, type: integer, default: 10, minimum: 1, maximum: 10000}
        freeMonthlyQuota: {title: Monthly hard unit quota, type: integer, default: 1000, minimum: 1}
        freeOverageMicrosPerUnit: {title: Overage price in micro-euros per unit, type: integer, default: 0, minimum: 0}
    - title: Pay as you go plan
      required: [paygMonthlyPriceCents, paygIncludedUnits, paygMonthlyQuota, paygRequestsPerMinute, paygOverageMicrosPerUnit]
      properties:
        paygMonthlyPriceCents: {title: Monthly price in euro cents, type: integer, default: 0, minimum: 0}
        paygIncludedUnits: {title: Included billable units, type: integer, default: 0, minimum: 0}
        paygMonthlyQuota: {title: Monthly hard unit quota, type: integer, default: 10000, minimum: 1}
        paygRequestsPerMinute: {title: Gateway requests per minute, type: integer, default: 100, minimum: 1}
        paygOverageMicrosPerUnit: {title: Price in micro-euros per accepted unit, description: 10000 micro-euros is €0.01 per request or AI token., type: integer, default: 10000, minimum: 0}
    - title: Developer plan
      required: [developerMonthlyPriceCents, developerIncludedUnits, developerMonthlyQuota, developerRequestsPerMinute, developerOverageMicrosPerUnit]
      properties:
        developerMonthlyPriceCents: {title: Monthly price in euro cents, type: integer, default: 4900, minimum: 0}
        developerIncludedUnits: {title: Included billable units, type: integer, default: 100000, minimum: 0}
        developerMonthlyQuota: {title: Monthly hard unit quota, type: integer, default: 1000000, minimum: 1}
        developerRequestsPerMinute: {title: Gateway requests per minute, type: integer, default: 1000, minimum: 1}
        developerOverageMicrosPerUnit: {title: Overage price in micro-euros per unit, type: integer, default: 1000, minimum: 0}
    - title: Business plan
      required: [businessMonthlyPriceCents, businessIncludedUnits, businessMonthlyQuota, businessRequestsPerMinute, businessOverageMicrosPerUnit]
      properties:
        businessMonthlyPriceCents: {title: Monthly price in euro cents, type: integer, default: 49900, minimum: 0}
        businessIncludedUnits: {title: Included billable units, type: integer, default: 5000000, minimum: 0}
        businessMonthlyQuota: {title: Monthly hard unit quota, type: integer, default: 50000000, minimum: 1}
        businessRequestsPerMinute: {title: Gateway requests per minute, type: integer, default: 10000, minimum: 1}
        businessOverageMicrosPerUnit: {title: Overage price in micro-euros per unit, type: integer, default: 500, minimum: 0}
    - title: Enterprise plan
      required: [enterpriseMonthlyPriceCents]
      properties:
        enterpriseMonthlyPriceCents: {title: Contract monthly price in euro cents, type: integer, default: 0, minimum: 0, description: Enterprise remains unlimited at the gateway; use zero when pricing is agreed offline.}
    - title: Dedicated GitHub repository
      required: [repoOwner, repoVisibility, githubToken]
      properties:
        repoOwner:
          title: GitHub organization
          type: string
          description: Organization where the dedicated repository will be created. The task token must have repository creation permission in this organization.
          default: arencloud
          pattern: '^[A-Za-z0-9](?:[A-Za-z0-9-]{0,37}[A-Za-z0-9])?$'
          maxLength: 39
        repoVisibility:
          title: Repository visibility
          type: string
          default: public
          description: Public is the portable profile; private repositories require a centrally configured GitHub App and Git read credentials.
          enum: [public]
        githubToken:
          title: GitHub access token
          type: string
          description: Used only by this scaffolder task. It needs permission to create repositories and write contents.
          ui:field: Secret
  steps:
    - id: render
      name: Render the Camel integration project
      action: fetch:template
      input:
        url: ./skeleton
        copyWithoutRender:
          - .github/workflows/**
        values:
          name: ${{ parameters.name }}
          displayName: ${{ parameters.displayName }}
          description: ${{ parameters.description }}
          apiPath: ${{ parameters.apiPath }}
          owner: ${{ parameters.owner }}
          lifecycle: ${{ parameters.lifecycle }}
          approvalMode: ${{ parameters.approvalMode }}
          publishStatus: ${{ parameters.publishStatus }}
          billingUnit: ${{ parameters.billingUnit }}
          freeMonthlyPriceCents: ${{ parameters.freeMonthlyPriceCents }}
          freeIncludedUnits: ${{ parameters.freeIncludedUnits }}
          freeRequestsPerMinute: ${{ parameters.freeRequestsPerMinute }}
          freeMonthlyQuota: ${{ parameters.freeMonthlyQuota }}
          freeOverageMicrosPerUnit: ${{ parameters.freeOverageMicrosPerUnit }}
          paygMonthlyPriceCents: ${{ parameters.paygMonthlyPriceCents }}
          paygIncludedUnits: ${{ parameters.paygIncludedUnits }}
          paygRequestsPerMinute: ${{ parameters.paygRequestsPerMinute }}
          paygMonthlyQuota: ${{ parameters.paygMonthlyQuota }}
          paygOverageMicrosPerUnit: ${{ parameters.paygOverageMicrosPerUnit }}
          developerMonthlyPriceCents: ${{ parameters.developerMonthlyPriceCents }}
          developerIncludedUnits: ${{ parameters.developerIncludedUnits }}
          developerRequestsPerMinute: ${{ parameters.developerRequestsPerMinute }}
          developerMonthlyQuota: ${{ parameters.developerMonthlyQuota }}
          developerOverageMicrosPerUnit: ${{ parameters.developerOverageMicrosPerUnit }}
          businessMonthlyPriceCents: ${{ parameters.businessMonthlyPriceCents }}
          businessIncludedUnits: ${{ parameters.businessIncludedUnits }}
          businessRequestsPerMinute: ${{ parameters.businessRequestsPerMinute }}
          businessMonthlyQuota: ${{ parameters.businessMonthlyQuota }}
          businessOverageMicrosPerUnit: ${{ parameters.businessOverageMicrosPerUnit }}
          enterpriseMonthlyPriceCents: ${{ parameters.enterpriseMonthlyPriceCents }}
          repoOwner: ${{ parameters.repoOwner }}
    - id: publish
      name: Create the dedicated GitHub repository
      action: publish:github
      input:
        repoUrl: github.com?owner=${{ parameters.repoOwner }}&repo=${{ parameters.name }}
        token: ${{ secrets.githubToken }}
        description: ${{ parameters.description }}
        defaultBranch: main
        repoVisibility: ${{ parameters.repoVisibility }}
        protectDefaultBranch: false
        gitCommitMessage: Bootstrap ${{ parameters.displayName }} from the Camel API Golden Path
    - id: register
      name: Register the generated integration
      action: catalog:register
      input:
        repoContentsUrl: ${{ steps.publish.output.repoContentsUrl }}
        catalogInfoPath: /catalog-info.yaml
  output:
    links:
      - title: Dedicated GitHub repository
        url: https://github.com/${{ parameters.repoOwner }}/${{ parameters.name }}
      - title: Open in the catalog
        entityRef: ${{ steps.register.output.entityRef }}
      - title: Open in OpenShift Dev Spaces
        url: /api/api-monetization/devspaces/open?owner=${{ parameters.repoOwner }}&repo=${{ parameters.name }}
      - title: Publish from the Component overview
        entityRef: ${{ steps.register.output.entityRef }}
