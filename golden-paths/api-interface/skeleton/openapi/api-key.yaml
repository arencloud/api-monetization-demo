openapi: 3.0.3
info:
  title: ${{ values.displayName }}
  version: 1.0.0
  description: ${{ values.description }}
servers:
  - url: https://api.example.invalid
    description: API-key endpoint; replaced by the admitted Gateway API hostname during publication
paths:
  ${{ values.apiPath }}:
    get:
      operationId: get${{ values.name }}WithApiKey
      summary: Invoke ${{ values.displayName }} with an API key
      security:
        - apiKey: []
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: object
                required: [api, message]
                properties:
                  api: {type: string}
                  message: {type: string}
                  request: {type: string}
        '401': {description: A valid API key is required}
        '403': {description: An active subscription is required}
        '429': {description: The selected plan limit has been reached}
components:
  securitySchemes:
    apiKey:
      type: apiKey
      in: header
      name: Authorization
      description: Paste the complete authorization value, including the prefix — `APIKEY <credential>`. OpenAPI clients do not add this custom prefix automatically.
