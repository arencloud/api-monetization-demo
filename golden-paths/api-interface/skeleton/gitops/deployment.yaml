apiVersion: apps/v1
kind: Deployment
metadata:
  name: ${{ values.name }}
  namespace: api-monetization-apps
  annotations:
    image.openshift.io/triggers: >-
      [{"from":{"kind":"ImageStreamTag","name":"${{ values.name }}:latest","namespace":"api-monetization-apps"},"fieldPath":"spec.template.spec.containers[?(@.name==\"api\")].image","paused":false}]
spec:
  replicas: 2
  selector:
    matchLabels: {app.kubernetes.io/name: '${{ values.name }}'}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ${{ values.name }}
        app.kubernetes.io/component: backend-api
        sidecar.istio.io/inject: "true"
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: api
          image: image-registry.openshift-image-registry.svc:5000/api-monetization-apps/${{ values.name }}:latest
          imagePullPolicy: Always
          ports: [{name: http, containerPort: 8080}]
          readinessProbe:
            httpGet: {path: /readyz, port: http}
            initialDelaySeconds: 2
            periodSeconds: 5
          livenessProbe:
            httpGet: {path: /healthz, port: http}
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests: {cpu: 50m, memory: 64Mi}
            limits: {cpu: 500m, memory: 256Mi}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: [ALL]}
            readOnlyRootFilesystem: true
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels: {app.kubernetes.io/name: '${{ values.name }}'}

