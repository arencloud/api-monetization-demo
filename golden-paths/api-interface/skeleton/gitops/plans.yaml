apiVersion: extensions.kuadrant.io/v1alpha1
kind: PlanPolicy
metadata:
  name: ${{ values.name }}-plans
  namespace: api-monetization-apps
  annotations: {argocd.argoproj.io/sync-wave: "30"}
spec:
  targetRef: {group: gateway.networking.k8s.io, kind: HTTPRoute, name: '${{ values.name }}-api-key'}
  plans:
    - tier: enterprise
      predicate: auth.identity.metadata.annotations['secret.kuadrant.io/plan-id'] == "enterprise"
      limits: {}
    - tier: developer
      predicate: auth.identity.metadata.annotations['secret.kuadrant.io/plan-id'] == "developer"
      limits:
        monthly: ${{ values.developerMonthlyQuota }}
        custom:
          - limit: ${{ values.developerRequestsPerMinute }}
            window: 1m
    - tier: business
      predicate: auth.identity.metadata.annotations['secret.kuadrant.io/plan-id'] == "business"
      limits:
        monthly: ${{ values.businessMonthlyQuota }}
        custom:
          - limit: ${{ values.businessRequestsPerMinute }}
            window: 1m
    - tier: payg
      predicate: auth.identity.metadata.annotations['secret.kuadrant.io/plan-id'] == "payg"
      limits:
        monthly: ${{ values.paygMonthlyQuota }}
        custom:
          - limit: ${{ values.paygRequestsPerMinute }}
            window: 1m
    - tier: free
      predicate: auth.identity.metadata.annotations['secret.kuadrant.io/plan-id'] == "free"
      limits:
        monthly: ${{ values.freeMonthlyQuota }}
        custom:
          - limit: ${{ values.freeRequestsPerMinute }}
            window: 1m
---
apiVersion: kuadrant.io/v1
kind: RateLimitPolicy
metadata:
  name: ${{ values.name }}-jwt
  namespace: api-monetization-apps
  annotations: {argocd.argoproj.io/sync-wave: "30"}
spec:
  targetRef: {group: gateway.networking.k8s.io, kind: HTTPRoute, name: '${{ values.name }}-jwt'}
  limits:
    business:
      rates:
        - {limit: '${{ values.businessRequestsPerMinute }}', window: 1m}
        - {limit: '${{ values.businessMonthlyQuota }}', window: 720h}
      counters: [{expression: auth.kuadrant.customer}]
      when: [{predicate: 'auth.kuadrant.plan == "business"'}]
    free:
      rates:
        - limit: ${{ values.freeRequestsPerMinute }}
          window: 1m
        - limit: ${{ values.freeMonthlyQuota }}
          window: 720h
      counters:
        - expression: auth.kuadrant.customer
      when:
        - predicate: auth.kuadrant.plan == "free"
    payg:
      rates:
        - {limit: '${{ values.paygRequestsPerMinute }}', window: 1m}
        - {limit: '${{ values.paygMonthlyQuota }}', window: 720h}
      counters: [{expression: auth.kuadrant.customer}]
      when: [{predicate: 'auth.kuadrant.plan == "payg"'}]
    developer:
      rates:
        - limit: ${{ values.developerRequestsPerMinute }}
          window: 1m
        - limit: ${{ values.developerMonthlyQuota }}
          window: 720h
      counters:
        - expression: auth.kuadrant.customer
      when:
        - predicate: auth.kuadrant.plan == "developer"
