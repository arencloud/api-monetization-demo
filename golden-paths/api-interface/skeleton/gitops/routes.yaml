apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: ${{ values.name }}-api-key-preflight
  namespace: api-monetization-apps
  annotations: {argocd.argoproj.io/sync-wave: "10"}
  labels: {app.kubernetes.io/name: '${{ values.name }}'}
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: api-monetization
      namespace: api-monetization-gateway
      sectionName: http
  hostnames: [api-monetization.invalid]
  rules:
    - matches:
        - method: OPTIONS
          path: {type: PathPrefix, value: '${{ values.apiPath }}'}
      filters:
        - type: ResponseHeaderModifier
