apiVersion: devportal.kuadrant.io/v1alpha1
kind: APIProduct
metadata:
  name: ${{ values.name }}-api
  namespace: api-monetization-apps
  annotations:
    argocd.argoproj.io/sync-wave: "40"
    backstage.io/owner: ${{ values.owner }}
    monetization.arencloud.com/product: ${{ values.name }}
    monetization.arencloud.com/path: ${{ values.apiPath }}
    monetization.arencloud.com/unit: ${{ values.billingUnit }}
    monetization.arencloud.com/plans: '{"free":{"monthlyPriceCents":${{ values.freeMonthlyPriceCents }},"includedUnits":${{ values.freeIncludedUnits }},"monthlyQuotaUnits":${{ values.freeMonthlyQuota }},"overageMicrosPerUnit":${{ values.freeOverageMicrosPerUnit }},"rateLimitRequests":${{ values.freeRequestsPerMinute }},"rateLimitWindowSeconds":60},"payg":{"monthlyPriceCents":${{ values.paygMonthlyPriceCents }},"includedUnits":${{ values.paygIncludedUnits }},"monthlyQuotaUnits":${{ values.paygMonthlyQuota }},"overageMicrosPerUnit":${{ values.paygOverageMicrosPerUnit }},"rateLimitRequests":${{ values.paygRequestsPerMinute }},"rateLimitWindowSeconds":60},"developer":{"monthlyPriceCents":${{ values.developerMonthlyPriceCents }},"includedUnits":${{ values.developerIncludedUnits }},"monthlyQuotaUnits":${{ values.developerMonthlyQuota }},"overageMicrosPerUnit":${{ values.developerOverageMicrosPerUnit }},"rateLimitRequests":${{ values.developerRequestsPerMinute }},"rateLimitWindowSeconds":60},"business":{"monthlyPriceCents":${{ values.businessMonthlyPriceCents }},"includedUnits":${{ values.businessIncludedUnits }},"monthlyQuotaUnits":${{ values.businessMonthlyQuota }},"overageMicrosPerUnit":${{ values.businessOverageMicrosPerUnit }},"rateLimitRequests":${{ values.businessRequestsPerMinute }},"rateLimitWindowSeconds":60},"enterprise":{"monthlyPriceCents":${{ values.enterpriseMonthlyPriceCents }},"includedUnits":null,"monthlyQuotaUnits":null,"overageMicrosPerUnit":0,"rateLimitRequests":null,"rateLimitWindowSeconds":null}}'
spec:
  displayName: ${{ values.displayName }}
  description: ${{ values.description }}
  version: v1
  approvalMode: ${{ values.approvalMode }}
  publishStatus: ${{ values.publishStatus }}
  targetRef: {group: gateway.networking.k8s.io, kind: HTTPRoute, name: '${{ values.name }}-api-key'}
  tags: [api, monetized, generated]
  contact: {team: API Owners, email: api-owners@example.invalid}
  documentation:
    docsURL: https://github.com/${{ values.repoOwner }}/${{ values.name }}/blob/main/README.md
    openAPISpecURL: http://${{ values.name }}.api-monetization-apps.svc.cluster.local:8082/openapi.yaml
    gitRepository: https://github.com/${{ values.repoOwner }}/${{ values.name }}
---
apiVersion: devportal.kuadrant.io/v1alpha1
kind: APIProduct
metadata:
  name: ${{ values.name }}-api-jwt
  namespace: api-monetization-apps
  annotations:
    argocd.argoproj.io/sync-wave: "40"
    backstage.io/owner: ${{ values.owner }}
    monetization.arencloud.com/product: ${{ values.name }}
    monetization.arencloud.com/path: ${{ values.apiPath }}
    monetization.arencloud.com/unit: ${{ values.billingUnit }}
    monetization.arencloud.com/plans: '{"free":{"monthlyPriceCents":${{ values.freeMonthlyPriceCents }},"includedUnits":${{ values.freeIncludedUnits }},"monthlyQuotaUnits":${{ values.freeMonthlyQuota }},"overageMicrosPerUnit":${{ values.freeOverageMicrosPerUnit }},"rateLimitRequests":${{ values.freeRequestsPerMinute }},"rateLimitWindowSeconds":60},"payg":{"monthlyPriceCents":${{ values.paygMonthlyPriceCents }},"includedUnits":${{ values.paygIncludedUnits }},"monthlyQuotaUnits":${{ values.paygMonthlyQuota }},"overageMicrosPerUnit":${{ values.paygOverageMicrosPerUnit }},"rateLimitRequests":${{ values.paygRequestsPerMinute }},"rateLimitWindowSeconds":60},"developer":{"monthlyPriceCents":${{ values.developerMonthlyPriceCents }},"includedUnits":${{ values.developerIncludedUnits }},"monthlyQuotaUnits":${{ values.developerMonthlyQuota }},"overageMicrosPerUnit":${{ values.developerOverageMicrosPerUnit }},"rateLimitRequests":${{ values.developerRequestsPerMinute }},"rateLimitWindowSeconds":60},"business":{"monthlyPriceCents":${{ values.businessMonthlyPriceCents }},"includedUnits":${{ values.businessIncludedUnits }},"monthlyQuotaUnits":${{ values.businessMonthlyQuota }},"overageMicrosPerUnit":${{ values.businessOverageMicrosPerUnit }},"rateLimitRequests":${{ values.businessRequestsPerMinute }},"rateLimitWindowSeconds":60},"enterprise":{"monthlyPriceCents":${{ values.enterpriseMonthlyPriceCents }},"includedUnits":null,"monthlyQuotaUnits":null,"overageMicrosPerUnit":0,"rateLimitRequests":null,"rateLimitWindowSeconds":null}}'
spec:
  displayName: ${{ values.displayName }} (Keycloak JWT)
  description: ${{ values.description }}
  version: v1
  approvalMode: ${{ values.approvalMode }}
  publishStatus: ${{ values.publishStatus }}
  targetRef: {group: gateway.networking.k8s.io, kind: HTTPRoute, name: '${{ values.name }}-jwt'}
  tags: [api, oidc, keycloak, monetized, generated]
  contact: {team: API Owners, email: api-owners@example.invalid}
  documentation:
    docsURL: https://github.com/${{ values.repoOwner }}/${{ values.name }}/blob/main/README.md
    openAPISpecURL: http://${{ values.name }}.api-monetization-apps.svc.cluster.local:8082/openapi.yaml
    gitRepository: https://github.com/${{ values.repoOwner }}/${{ values.name }}
