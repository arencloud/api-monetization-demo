apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - build.yaml
  - deployment.yaml
  - service.yaml
  - monitoring.yaml
  - routes.yaml
  - auth-policies.yaml
  - plans.yaml
  - api-products.yaml
labels:
  - pairs:
      app.kubernetes.io/part-of: api-monetization
      monetization.arencloud.com/product: ${{ values.name }}
