<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1120" viewBox="0 0 1800 1120" role="img" aria-labelledby="title description">
  <title id="title">API Monetization on Red Hat OpenShift architecture</title>
  <desc id="description">API consumers enter through Keycloak and Gateway API. Red Hat Connectivity Link authenticates, authorizes, and rate limits traffic before Service Mesh routes it to Inventory, Payment, and AI Chat APIs. A PostgreSQL-backed control plane manages products, plans, subscriptions, usage, and billing. GitOps, observability, OpenShift AI, and External Secrets support the platform.</desc>
  <defs>
    <linearGradient id="page" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f7f9fc"/>
      <stop offset="1" stop-color="#eef3fa"/>
    </linearGradient>
    <linearGradient id="dark" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#151515"/>
      <stop offset="1" stop-color="#292929"/>
    </linearGradient>
    <linearGradient id="red" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ee0000"/>
      <stop offset="1" stop-color="#a30000"/>
    </linearGradient>
    <linearGradient id="blue" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0066cc"/>
      <stop offset="1" stop-color="#004b95"/>
    </linearGradient>
    <linearGradient id="violet" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6753ac"/>
      <stop offset="1" stop-color="#3d2c78"/>
    </linearGradient>
    <filter id="shadow" x="-15%" y="-20%" width="130%" height="150%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#151515" flood-opacity=".10"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M0 0l10 5-10 5z" fill="#4f5255"/>
    </marker>
    <marker id="arrowBlue" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M0 0l10 5-10 5z" fill="#0066cc"/>
    </marker>
    <marker id="arrowGreen" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M0 0l10 5-10 5z" fill="#3e8635"/>
    </marker>
    <style>
      .title{font:700 32px 'Red Hat Display',Arial,sans-serif;fill:#151515}.subtitle{font:400 16px 'Red Hat Text',Arial,sans-serif;fill:#6a6e73}
      .section{font:700 14px 'Red Hat Text',Arial,sans-serif;letter-spacing:1.6px;fill:#c9190b}.sectionLight{font:700 14px 'Red Hat Text',Arial,sans-serif;letter-spacing:1.6px;fill:#ffb5b5}
      .cardTitle{font:700 18px 'Red Hat Display',Arial,sans-serif;fill:#151515}.cardTitleLight{font:700 18px 'Red Hat Display',Arial,sans-serif;fill:#fff}
      .label{font:600 14px 'Red Hat Text',Arial,sans-serif;fill:#151515}.labelLight{font:600 14px 'Red Hat Text',Arial,sans-serif;fill:#fff}
      .copy{font:400 13px 'Red Hat Text',Arial,sans-serif;fill:#4f5255}.copyLight{font:400 13px 'Red Hat Text',Arial,sans-serif;fill:#d2d2d2}
      .tiny{font:400 11px 'Red Hat Text',Arial,sans-serif;fill:#6a6e73}.pill{font:600 12px 'Red Hat Text',Arial,sans-serif;fill:#151515}
      .panel{fill:#fff;stroke:#d2d2d2;stroke-width:1.5}.softBlue{fill:#f1f7fd;stroke:#73bcf7;stroke-width:1.5}.softGreen{fill:#f3faf2;stroke:#6ec664;stroke-width:1.5}.softGold{fill:#fff8e7;stroke:#f4c145;stroke-width:1.5}.softViolet{fill:#f5f2ff;stroke:#a18fff;stroke-width:1.5}
      .flow{fill:none;stroke:#4f5255;stroke-width:3;marker-end:url(#arrow)}.signal{fill:none;stroke:#0066cc;stroke-width:2;stroke-dasharray:7 7;marker-end:url(#arrowBlue)}.manage{fill:none;stroke:#3e8635;stroke-width:2;stroke-dasharray:7 7;marker-end:url(#arrowGreen)}
    </style>
  </defs>

  <rect width="1800" height="1120" fill="url(#page)"/>
  <rect x="0" y="0" width="1800" height="8" fill="url(#red)"/>
  <text x="56" y="58" class="title">API Monetization on Red Hat OpenShift</text>
  <text x="56" y="86" class="subtitle">Developer experience, request-time enforcement, commercial control, and telemetry — reconciled by OpenShift GitOps</text>

  <!-- Consumers -->
  <g filter="url(#shadow)">
    <rect x="330" y="118" width="1140" height="150" rx="18" class="softGold"/>
  </g>
  <text x="362" y="150" class="section">API CONSUMERS</text>
  <g transform="translate(390 172)">
    <circle cx="28" cy="22" r="18" fill="none" stroke="#ee0000" stroke-width="5"/><path d="M0 76c3-24 14-35 28-35s25 11 28 35z" fill="none" stroke="#ee0000" stroke-width="5"/><text x="76" y="25" class="cardTitle">Developers</text><text x="76" y="48" class="copy">Discover, subscribe, build</text>
  </g>
  <g transform="translate(680 172)">
    <circle cx="32" cy="32" r="32" fill="url(#blue)"/><path d="M8 27h48M16 10c18 14 22 30 29 49M50 9C33 23 27 40 20 58" fill="none" stroke="#fff" stroke-opacity=".7" stroke-width="5"/><text x="82" y="25" class="cardTitle">Applications</text><text x="82" y="48" class="copy">Web, mobile, automation</text>
  </g>
  <g transform="translate(1000 172)">
    <rect x="0" y="3" width="66" height="58" rx="7" fill="none" stroke="#151515" stroke-width="5"/><path d="M14 18l16 14-16 14M36 46h17" fill="none" stroke="#151515" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><text x="86" y="25" class="cardTitle">API tools</text><text x="86" y="48" class="copy">Postman, CLI, integrations</text>
  </g>
  <rect x="730" y="286" width="340" height="38" rx="19" fill="#fff" stroke="#f4c145"/>
  <text x="900" y="310" text-anchor="middle" class="pill">HTTPS · REST · JSON · OpenAI-compatible</text>

  <!-- Identity and edge -->
  <g filter="url(#shadow)"><rect x="44" y="356" width="240" height="330" rx="18" class="softBlue"/></g>
  <text x="72" y="390" class="section">IDENTITY &amp; EDGE</text>
  <rect x="72" y="416" width="184" height="92" rx="12" fill="#fff" stroke="#73bcf7"/>
  <circle cx="104" cy="448" r="18" fill="url(#red)"/><path d="M96 448h16M104 440v16" stroke="#fff" stroke-width="3"/>
  <text x="136" y="444" class="label">Red Hat build</text><text x="136" y="463" class="label">of Keycloak</text><text x="88" y="491" class="tiny">OIDC · JWT · users · groups</text>
  <rect x="72" y="524" width="184" height="72" rx="12" fill="#fff" stroke="#73bcf7"/>
  <path d="M91 559h35m-9-12l12 12-12 12" fill="none" stroke="#0066cc" stroke-width="4"/><text x="140" y="554" class="label">OpenShift Route</text><text x="140" y="574" class="tiny">Portable public edge</text>
  <rect x="72" y="612" width="184" height="48" rx="12" fill="#fff" stroke="#73bcf7"/>
  <text x="164" y="642" text-anchor="middle" class="label">Gateway API · TLS</text>

  <!-- Data plane -->
  <g filter="url(#shadow)"><rect x="330" y="356" width="790" height="330" rx="18" class="softGreen"/></g>
  <text x="360" y="390" class="section">DATA PLANE · REQUEST PATH</text>
  <text x="360" y="412" class="tiny">Red Hat Connectivity Link · Service Mesh 3 · mTLS end to end</text>
  <rect x="360" y="432" width="430" height="218" rx="16" fill="#fff" stroke="#6ec664" stroke-width="1.5"/>
  <rect x="382" y="454" width="386" height="48" rx="10" fill="url(#dark)"/>
  <circle cx="407" cy="478" r="12" fill="#ee0000"/><path d="M401 478h12M407 472v12" stroke="#fff" stroke-width="2"/>
  <text x="430" y="484" class="cardTitleLight">Red Hat Connectivity Link</text>
  <g transform="translate(382 524)">
    <rect width="112" height="100" rx="12" class="softBlue"/><text x="56" y="31" text-anchor="middle" class="label">APIProduct</text><text x="56" y="53" text-anchor="middle" class="tiny">Discovery</text><text x="56" y="70" text-anchor="middle" class="tiny">OpenAPI</text><text x="56" y="87" text-anchor="middle" class="tiny">Lifecycle</text>
    <rect x="126" width="112" height="100" rx="12" class="softGold"/><text x="182" y="31" text-anchor="middle" class="label">Plans</text><text x="182" y="53" text-anchor="middle" class="tiny">Free · PAYG</text><text x="182" y="70" text-anchor="middle" class="tiny">Developer</text><text x="182" y="87" text-anchor="middle" class="tiny">Business</text>
    <rect x="252" width="112" height="100" rx="12" class="softViolet"/><text x="308" y="31" text-anchor="middle" class="label">Policies</text><text x="308" y="53" text-anchor="middle" class="tiny">Auth</text><text x="308" y="70" text-anchor="middle" class="tiny">Limits</text><text x="308" y="87" text-anchor="middle" class="tiny">Tokens</text>
  </g>
  <rect x="816" y="432" width="128" height="218" rx="16" fill="#fff" stroke="#6ec664" stroke-width="1.5"/>
  <circle cx="880" cy="480" r="26" fill="#ee0000"/><path d="M880 458v44M858 480h44M864 464l32 32M896 464l-32 32" stroke="#fff" stroke-width="3"/>
  <text x="880" y="531" text-anchor="middle" class="label">Service Mesh 3</text><text x="880" y="554" text-anchor="middle" class="tiny">STRICT mTLS</text><text x="880" y="574" text-anchor="middle" class="tiny">Traffic</text><text x="880" y="594" text-anchor="middle" class="tiny">Telemetry</text>
  <g transform="translate(966 432)">
    <rect width="126" height="62" rx="12" class="panel"/><text x="63" y="27" text-anchor="middle" class="label">Inventory API</text><text x="63" y="47" text-anchor="middle" class="tiny">Request metered</text>
    <rect y="78" width="126" height="62" rx="12" class="panel"/><text x="63" y="105" text-anchor="middle" class="label">Payment API</text><text x="63" y="125" text-anchor="middle" class="tiny">Request metered</text>
    <rect y="156" width="126" height="62" rx="12" class="softViolet"/><text x="63" y="183" text-anchor="middle" class="label">AI Chat API</text><text x="63" y="203" text-anchor="middle" class="tiny">Token metered</text>
  </g>
  <path d="M284 636H330" class="flow"/><path d="M790 541h26" class="flow"/><path d="M944 541h22" class="flow"/>

  <!-- Commercial control plane -->
  <g filter="url(#shadow)"><rect x="1160" y="356" width="596" height="430" rx="22" class="softBlue"/></g>
  <text x="1192" y="390" class="section">MONETIZATION &amp; CONTROL PLANE</text>
  <g transform="translate(1192 420)">
    <rect width="122" height="154" rx="14" class="panel"/><text x="61" y="30" text-anchor="middle" class="label">Products</text><text x="16" y="60" class="copy">• Catalog</text><text x="16" y="84" class="copy">• Lifecycle</text><text x="16" y="108" class="copy">• OpenAPI</text><text x="16" y="132" class="copy">• Endpoints</text>
    <rect x="138" width="122" height="154" rx="14" class="panel"/><text x="199" y="30" text-anchor="middle" class="label">Plans</text><text x="154" y="60" class="copy">• Tiers</text><text x="154" y="84" class="copy">• Quotas</text><text x="154" y="108" class="copy">• Pricing</text><text x="154" y="132" class="copy">• Limits</text>
    <rect x="276" width="122" height="154" rx="14" class="panel"/><text x="337" y="30" text-anchor="middle" class="label">Customers</text><text x="292" y="60" class="copy">• Sign-up</text><text x="292" y="84" class="copy">• Access</text><text x="292" y="108" class="copy">• Status</text><text x="292" y="132" class="copy">• History</text>
    <rect x="414" width="122" height="154" rx="14" class="panel"/><text x="475" y="30" text-anchor="middle" class="label">Billing</text><text x="430" y="60" class="copy">• Usage</text><text x="430" y="84" class="copy">• Invoices</text><text x="430" y="108" class="copy">• Revenue</text><text x="430" y="132" class="copy">• Reports</text>
  </g>
  <rect x="1192" y="596" width="532" height="158" rx="16" fill="#fff" stroke="#73bcf7"/>
  <circle cx="1253" cy="663" r="38" fill="#0066cc"/><path d="M1229 645h48v40h-48zM1238 638v54M1268 638v54" fill="none" stroke="#fff" stroke-width="4"/>
  <text x="1310" y="640" class="cardTitle">CloudNativePG</text><text x="1310" y="665" class="copy">Subscriptions · plans · accepted usage</text><text x="1310" y="687" class="copy">Invoices · payments · audit history</text><text x="1310" y="709" class="copy">Commercial system of record</text>
  <path d="M1160 470H1120" class="signal"/>

  <!-- Policy enforcement -->
  <g filter="url(#shadow)"><rect x="330" y="726" width="790" height="164" rx="18" class="softGreen"/></g>
  <text x="360" y="760" class="section">ENFORCEMENT POLICIES</text>
  <g transform="translate(370 788)">
    <g><circle cx="42" cy="32" r="30" fill="#fff" stroke="#6ec664"/><path d="M29 32l9 9 19-20" fill="none" stroke="#3e8635" stroke-width="5"/><text x="42" y="82" text-anchor="middle" class="tiny">API key</text></g>
    <g transform="translate(118)"><circle cx="42" cy="32" r="30" fill="#fff" stroke="#6ec664"/><path d="M29 32l9 9 19-20" fill="none" stroke="#3e8635" stroke-width="5"/><text x="42" y="82" text-anchor="middle" class="tiny">JWT</text></g>
    <g transform="translate(236)"><circle cx="42" cy="32" r="30" fill="#fff" stroke="#6ec664"/><path d="M25 35h34M42 18v34" stroke="#3e8635" stroke-width="4"/><text x="42" y="82" text-anchor="middle" class="tiny">Subscription</text></g>
    <g transform="translate(354)"><circle cx="42" cy="32" r="30" fill="#fff" stroke="#6ec664"/><path d="M28 23h28v22H28zM33 29h18M33 35h13" fill="none" stroke="#3e8635" stroke-width="3"/><text x="42" y="82" text-anchor="middle" class="tiny">Plan</text></g>
    <g transform="translate(472)"><circle cx="42" cy="32" r="30" fill="#fff" stroke="#6ec664"/><path d="M19 44a25 25 0 0146 0M42 38l13-13" fill="none" stroke="#3e8635" stroke-width="4"/><text x="42" y="82" text-anchor="middle" class="tiny">Request limit</text></g>
    <g transform="translate(590)"><circle cx="42" cy="32" r="30" fill="#fff" stroke="#6ec664"/><path d="M19 44a25 25 0 0146 0M42 38l13-13" fill="none" stroke="#3e8635" stroke-width="4"/><text x="42" y="82" text-anchor="middle" class="tiny">Token limit</text></g>
  </g>
  <path d="M724 726V650" class="manage"/>

  <!-- OpenShift AI -->
  <g filter="url(#shadow)"><rect x="1160" y="824" width="290" height="238" rx="20" class="softViolet"/></g>
  <text x="1190" y="858" class="section">OPENSHIFT AI</text>
  <circle cx="1228" cy="913" r="38" fill="url(#violet)"/><path d="M1210 913h36M1228 895v36M1216 901l24 24M1240 901l-24 24" stroke="#fff" stroke-width="4"/>
  <text x="1284" y="900" class="cardTitle">CPU-hosted LLM</text><text x="1284" y="924" class="copy">KServe · vLLM</text>
  <text x="1190" y="974" class="copy">Prompt + completion tokens</text><text x="1190" y="997" class="copy">RHCL TokenRateLimitPolicy</text><text x="1190" y="1020" class="copy">Actual-token billing attribution</text>
  <path d="M1092 619c65 0 70 160 90 205" class="manage"/>

  <!-- External secrets -->
  <g filter="url(#shadow)"><rect x="1480" y="824" width="276" height="238" rx="20" class="softGreen"/></g>
  <text x="1510" y="858" class="section">SECRETS</text>
  <circle cx="1548" cy="913" r="38" fill="#3e8635"/><path d="M1530 916a18 18 0 1132 11l-3 3h-12v10h-12v-12l5-5" fill="none" stroke="#fff" stroke-width="5"/>
  <text x="1604" y="900" class="cardTitle">External Secrets</text><text x="1604" y="924" class="copy">Operator-managed</text>
  <text x="1510" y="974" class="copy">Generated passwords</text><text x="1510" y="997" class="copy">Generated API keys</text><text x="1510" y="1020" class="copy">Namespace-scoped delivery</text>
  <path d="M1618 824V786" class="manage"/>

  <!-- Cross-cutting foundations -->
  <g filter="url(#shadow)"><rect x="44" y="726" width="240" height="336" rx="18" class="softBlue"/></g>
  <text x="72" y="760" class="section">OBSERVABILITY</text>
  <g transform="translate(72 790)">
    <rect width="184" height="54" rx="10" fill="#fff" stroke="#73bcf7"/><circle cx="27" cy="27" r="12" fill="#f0ab00"/><text x="50" y="33" class="label">Grafana dashboards</text>
    <rect y="66" width="184" height="54" rx="10" fill="#fff" stroke="#73bcf7"/><circle cx="27" cy="93" r="12" fill="#ee0000"/><text x="50" y="99" class="label">Prometheus metrics</text>
    <rect y="132" width="184" height="54" rx="10" fill="#fff" stroke="#73bcf7"/><circle cx="27" cy="159" r="12" fill="#0066cc"/><text x="50" y="165" class="label">Loki logs</text>
    <rect y="198" width="184" height="54" rx="10" fill="#fff" stroke="#73bcf7"/><circle cx="27" cy="225" r="12" fill="#6753ac"/><text x="50" y="231" class="label">Tempo traces</text>
  </g>
  <path d="M284 850H330" class="signal"/>

  <g filter="url(#shadow)"><rect x="330" y="928" width="790" height="134" rx="18" fill="url(#dark)"/></g>
  <text x="360" y="962" class="sectionLight">GITOPS &amp; DELIVERY</text>
  <g transform="translate(376 985)">
    <circle cx="20" cy="20" r="20" fill="#ee0000"/><text x="20" y="25" text-anchor="middle" class="labelLight">1</text><text x="52" y="25" class="copyLight">Commit</text>
    <path d="M132 20h48" stroke="#d2d2d2" stroke-width="2" marker-end="url(#arrow)"/>
    <circle cx="210" cy="20" r="20" fill="#0066cc"/><text x="210" y="25" text-anchor="middle" class="labelLight">2</text><text x="242" y="25" class="copyLight">Argo CD sync</text>
    <path d="M350 20h50" stroke="#d2d2d2" stroke-width="2" marker-end="url(#arrow)"/>
    <circle cx="430" cy="20" r="20" fill="#f0ab00"/><text x="430" y="25" text-anchor="middle" class="labelLight">3</text><text x="462" y="25" class="copyLight">OpenShift build</text>
    <path d="M596 20h54" stroke="#d2d2d2" stroke-width="2" marker-end="url(#arrow)"/>
    <circle cx="680" cy="20" r="20" fill="#3e8635"/><text x="680" y="25" text-anchor="middle" class="labelLight">4</text><text x="712" y="25" class="copyLight">Deploy</text>
  </g>

  <!-- Cross-cutting signals -->
  <path d="M900 324V356" class="flow"/>
  <path d="M284 470c25 0 20-90 76-90" class="signal"/>
  <path d="M520 686v40" class="signal"/>
  <path d="M1120 630c28 0 18 80 40 80" class="signal"/>
  <text x="890" y="1092" text-anchor="middle" class="tiny">Solid lines: request path · Blue dashed lines: telemetry and identity · Green dashed lines: control and reconciliation</text>
</svg>
