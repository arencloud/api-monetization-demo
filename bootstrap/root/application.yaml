apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: api-monetization-root
  namespace: openshift-gitops
  labels:
    app.kubernetes.io/name: api-monetization-root
    app.kubernetes.io/part-of: api-monetization
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/arencloud/api-monetization-demo.git
    targetRevision: feature/api-owner-golden-paths
    path: gitops/applications
  destination:
    server: https://kubernetes.default.svc
    namespace: openshift-gitops
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    retry:
      limit: 10
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 3m
    syncOptions:
      - ServerSideApply=true
