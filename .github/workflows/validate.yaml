name: Validate

on:
  pull_request:
  push:
    branches:
      - main
      - "feature/**"

permissions:
  contents: read

concurrency:
  group: validate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  repository-validation:
    name: Repository validation
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: .github/requirements-ci.txt

      - name: Install Python validation dependencies
        run: python -m pip install --requirement .github/requirements-ci.txt

      - name: Install OpenShift CLI
        uses: redhat-actions/openshift-tools-installer@v3.0
        with:
          source: mirror
          oc: "4.22"

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: plugins/rhdh-policy-catalog/package-lock.json

      - name: Validate deployment configuration
        run: make validate

      - name: Run unit tests
        run: make test

      - name: Build and test the RHDH effective-policy plugin
        run: make rhdh-plugin-test

      - name: Verify the committed RHDH plugin artifact
        run: git diff --exit-code -- platform/developer-hub/arencloud-rhdh-policy-catalog-dynamic-0.1.0.tgz
