openapi: 3.0.3
info:
  title: Inventory API (Keycloak JWT)
  version: 1.0.0
  description: Product and stock availability API authenticated by Red Hat build of Keycloak and monetized by Red Hat Connectivity Link.
servers:
  - url: https://jwt.api-monetization.invalid
    description: Keycloak JWT endpoint; replaced by the admitted Gateway API hostname during publication
tags:
  - name: inventory
    description: Product availability operations
paths:
  /inventory:
    get:
      tags: [inventory]
      operationId: listInventoryWithKeycloakJwt
      summary: List inventory
      description: Returns all demonstration inventory items available to the subscribed consumer.
      security:
        - keycloakBearer: []
      responses:
        '200':
          description: Current inventory
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InventoryList'
        '401': {description: A valid Keycloak bearer token is required}
        '403': {description: An active subscription is required}
        '429': {description: The selected plan limit has been reached}
  /inventory/{sku}:
    get:
      tags: [inventory]
      operationId: getInventoryItemWithKeycloakJwt
      summary: Get one inventory item
      security:
        - keycloakBearer: []
      parameters:
        - name: sku
          in: path
          required: true
          description: Stock keeping unit identifier
          schema: {type: string, example: RHCL-001}
      responses:
        '200':
          description: Inventory item
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InventoryItem'
        '401': {description: A valid Keycloak bearer token is required}
        '403': {description: An active subscription is required}
        '404': {description: Item not found}
        '429': {description: The selected plan limit has been reached}
components:
  securitySchemes:
    keycloakBearer:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: 'Paste the Keycloak access token. Swagger sends it as `Authorization: Bearer <token>`.'
  schemas:
    InventoryItem:
      type: object
      required: [sku, name, available, region]
      properties:
        sku: {type: string, example: RHCL-001}
        name: {type: string, example: Connectivity Link}
        available: {type: integer, example: 42}
        region: {type: string, example: primary}
    InventoryList:
      type: object
      required: [items, count]
      properties:
        items:
          type: array
          items: {$ref: '#/components/schemas/InventoryItem'}
        count: {type: integer, example: 3}
