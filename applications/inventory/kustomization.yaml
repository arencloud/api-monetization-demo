apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - build.yaml
  - deployment.yaml
  - service.yaml
  - monitoring.yaml
configMapGenerator:
  - name: inventory-api-openapi
    namespace: api-monetization-apps
    files:
      - openapi.yaml
    options:
      labels:
        app.kubernetes.io/name: inventory-api
        app.kubernetes.io/part-of: api-monetization
generatorOptions:
  disableNameSuffixHash: true
