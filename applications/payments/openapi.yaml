openapi: 3.0.3
info:
  title: Payment API
  version: 1.0.0
  description: Payment authorization and settlement API monetized by Red Hat Connectivity Link.
servers:
  # Replaced by the gateway route-host hook with the admitted OpenShift Route.
  - url: https://api-monetization.invalid
    description: OpenShift API gateway
paths:
  /payments:
    get:
      operationId: listPayments
      summary: List payments
      responses:
        "200":
          description: Current payments
  /payments/{id}:
    get:
      operationId: getPayment
      summary: Get one payment
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Payment details
        "404":
          description: Payment not found
