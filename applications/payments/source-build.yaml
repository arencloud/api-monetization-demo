apiVersion: v1
kind: ServiceAccount
metadata:
  name: payments-api-builder
  namespace: api-monetization-apps
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
  labels:
    app.kubernetes.io/name: payments-api-builder
    app.kubernetes.io/part-of: api-monetization
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: payments-api-builder
  namespace: api-monetization-apps
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
  labels:
    app.kubernetes.io/name: payments-api-builder
    app.kubernetes.io/part-of: api-monetization
rules:
  - apiGroups: [build.openshift.io]
    resources: [buildconfigs]
    resourceNames: [payments-api]
    verbs: [get]
  - apiGroups: [build.openshift.io]
    resources: [buildconfigs/instantiate]
    resourceNames: [payments-api]
    verbs: [create]
  - apiGroups: [build.openshift.io]
    resources: [builds]
    verbs: [get, list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: payments-api-builder
  namespace: api-monetization-apps
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
  labels:
    app.kubernetes.io/name: payments-api-builder
    app.kubernetes.io/part-of: api-monetization
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: payments-api-builder
subjects:
  - kind: ServiceAccount
    name: payments-api-builder
    namespace: api-monetization-apps
---
apiVersion: batch/v1
kind: Job
metadata:
  name: payments-api-source-build
  namespace: api-monetization-apps
  annotations:
    argocd.argoproj.io/hook: Sync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation,HookSucceeded
    argocd.argoproj.io/sync-wave: "-1"
  labels:
    app.kubernetes.io/name: payments-api-source-build
    app.kubernetes.io/part-of: api-monetization
spec:
  activeDeadlineSeconds: 1200
  backoffLimit: 1
  template:
    metadata:
      annotations:
        sidecar.istio.io/inject: "false"
      labels:
        app.kubernetes.io/name: payments-api-source-build
        app.kubernetes.io/part-of: api-monetization
    spec:
      serviceAccountName: payments-api-builder
      restartPolicy: Never
      containers:
        - name: build
          image: registry.redhat.io/openshift4/ose-cli-rhel9:v4.22
          imagePullPolicy: IfNotPresent
          command: [/bin/bash, -Eeuo, pipefail, -c]
          args:
            - |
              echo "building payments-api from the configured Git revision"
              oc start-build payments-api --wait
          resources:
            requests: {cpu: 10m, memory: 64Mi}
            limits: {cpu: 200m, memory: 256Mi}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: [ALL]}
            runAsNonRoot: true
            seccompProfile: {type: RuntimeDefault}
