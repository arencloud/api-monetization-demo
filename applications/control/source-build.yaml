apiVersion: v1
kind: ServiceAccount
metadata:
  name: monetization-control-builder
  namespace: api-monetization-data
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
  labels:
    app.kubernetes.io/name: monetization-control-builder
    app.kubernetes.io/part-of: api-monetization
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: monetization-control-builder
  namespace: api-monetization-data
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
  labels:
    app.kubernetes.io/name: monetization-control-builder
    app.kubernetes.io/part-of: api-monetization
rules:
  - apiGroups:
      - build.openshift.io
    resources:
      - buildconfigs
    resourceNames:
      - monetization-control
    verbs:
      - get
  - apiGroups:
      - build.openshift.io
    resources:
      - buildconfigs/instantiate
    resourceNames:
      - monetization-control
    verbs:
      - create
  - apiGroups:
      - build.openshift.io
    resources:
      - builds
    verbs:
      - get
      - list
      - watch
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: monetization-control-builder
  namespace: api-monetization-data
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
  labels:
    app.kubernetes.io/name: monetization-control-builder
    app.kubernetes.io/part-of: api-monetization
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: monetization-control-builder
subjects:
  - kind: ServiceAccount
    name: monetization-control-builder
    namespace: api-monetization-data
---
apiVersion: batch/v1
kind: Job
metadata:
  name: monetization-control-source-build
  namespace: api-monetization-data
  annotations:
    argocd.argoproj.io/hook: Sync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation,HookSucceeded
    argocd.argoproj.io/sync-wave: "-1"
  labels:
    app.kubernetes.io/name: monetization-control-source-build
    app.kubernetes.io/part-of: api-monetization
spec:
  activeDeadlineSeconds: 1200
  backoffLimit: 1
  template:
    metadata:
      annotations:
        sidecar.istio.io/inject: "false"
      labels:
        app.kubernetes.io/name: monetization-control-source-build
        app.kubernetes.io/part-of: api-monetization
    spec:
      serviceAccountName: monetization-control-builder
      restartPolicy: Never
      containers:
        - name: build
          image: registry.redhat.io/openshift4/ose-cli-rhel9:v4.22
          imagePullPolicy: IfNotPresent
          command:
            - /bin/bash
            - -Eeuo
            - pipefail
            - -c
            - |
              echo "building monetization-control from the configured Git revision"
              oc start-build monetization-control --wait
          resources:
            requests:
              cpu: 10m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            runAsNonRoot: true
            seccompProfile:
              type: RuntimeDefault
