<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>API Monetization Control Plane</title>
  <style>
    :root { color-scheme: dark; font-family: Inter, system-ui, sans-serif; background: #0b0d10; color: #f4f4f4; }
    body { margin: 0; padding: 3rem; background: radial-gradient(circle at top right, #3b1518, #0b0d10 45%); min-height: 100vh; }
    main { max-width: 980px; margin: auto; }
    h1 { font-size: clamp(2rem, 6vw, 4.5rem); margin: 0; letter-spacing: -.05em; }
    .eyebrow { color: #ee0000; font-weight: 700; text-transform: uppercase; letter-spacing: .12em; }
    .grid { display: grid; grid-template-columns: repeat(auto-fit,minmax(210px,1fr)); gap: 1rem; margin-top: 2rem; }
    .card { background: #17191d; border: 1px solid #34373d; border-radius: 14px; padding: 1.25rem; box-shadow: 0 12px 30px #0008; }
    .value { font-size: 2rem; font-weight: 750; margin-top: .4rem; }
    button { background: #ee0000; color: white; border: 0; border-radius: 7px; padding: .75rem 1rem; font-weight: 700; cursor: pointer; }
    button:hover { background: #ff3b3b; }
    select { background: #25282d; color: white; border: 1px solid #555; border-radius: 7px; padding: .7rem; margin-right: .5rem; }
    #status { min-height: 1.5rem; color: #b8bbbe; }
  </style>
</head>
<body>
<main>
  <p class="eyebrow">Red Hat Connectivity Link demo</p>
  <h1>API Monetization</h1>
  <p>Commercial state in PostgreSQL. Enforcement state reconciled live through RHCL.</p>
  <section class="grid">
    <article class="card"><div>Customer</div><div class="value" id="customer">—</div></article>
    <article class="card"><div>API product</div><div class="value" id="product">—</div></article>
    <article class="card"><div>Current plan</div><div class="value" id="plan">—</div></article>
    <article class="card"><div>Rate limit</div><div class="value" id="limit">—</div></article>
    <article class="card"><div>Billable requests</div><div class="value" id="usage">—</div></article>
    <article class="card"><div>Projected revenue</div><div class="value" id="revenue">—</div></article>
  </section>
  <section class="card" style="margin-top:1rem">
    <h2>Live plan change</h2>
    <select id="plans"></select><button id="upgrade">Apply without restart</button>
    <p id="status"></p>
  </section>
</main>
<script>
const state = { subscription: null };
async function refresh() {
  const [subscriptions, plans, usage] = await Promise.all([fetch('/api/subscriptions').then(r => r.json()), fetch('/api/plans').then(r => r.json()), fetch('/api/usage').then(r => r.json())]);
  state.subscription = subscriptions[0];
  document.querySelector('#customer').textContent = state.subscription.customer;
  document.querySelector('#product').textContent = state.subscription.product;
  document.querySelector('#plan').textContent = state.subscription.planName;
  document.querySelector('#limit').textContent = state.subscription.rateLimitRequests ? `${state.subscription.rateLimitRequests} / ${state.subscription.rateLimitWindowSeconds}s` : 'Unlimited';
  document.querySelector('#usage').textContent = usage[0].requests.toLocaleString();
  document.querySelector('#revenue').textContent = `€${usage[0].projectedRevenueEuro.toFixed(2)}`;
  document.querySelector('#plans').innerHTML = plans.map(p => `<option value="${p.id}" ${p.id === state.subscription.plan ? 'selected' : ''}>${p.displayName}</option>`).join('');
}
document.querySelector('#upgrade').addEventListener('click', async () => {
  const status = document.querySelector('#status'); status.textContent = 'Reconciling commercial and enforcement state…';
  const response = await fetch(`/api/subscriptions/${state.subscription.customerId}/plan`, {method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({plan:document.querySelector('#plans').value})});
  status.textContent = response.ok ? 'Plan is live. No workloads were restarted.' : `Upgrade failed: ${(await response.json()).error}`;
  if (response.ok) await refresh();
});
refresh().catch(error => document.querySelector('#status').textContent = error);
</script>
</body>
</html>
