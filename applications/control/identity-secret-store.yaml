apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: monetization-owner-approval-client-reader
  namespace: api-monetization-identity
  labels:
    app.kubernetes.io/part-of: api-monetization
rules:
  - apiGroups: [""]
    resources: [secrets]
    resourceNames: [monetization-owner-approval-keycloak-client]
    verbs: [get]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: monetization-owner-approval-client-reader
  namespace: api-monetization-identity
  labels:
    app.kubernetes.io/part-of: api-monetization
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: monetization-owner-approval-client-reader
subjects:
  - kind: ServiceAccount
    name: monetization-control
    namespace: api-monetization-data
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: monetization-owner-approval-secret-store-reviewer
  labels:
    app.kubernetes.io/part-of: api-monetization
rules:
  - apiGroups: [authorization.k8s.io]
    resources: [selfsubjectrulesreviews]
    verbs: [create]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: monetization-owner-approval-secret-store-reviewer
  labels:
    app.kubernetes.io/part-of: api-monetization
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: monetization-owner-approval-secret-store-reviewer
subjects:
  - kind: ServiceAccount
    name: monetization-control
    namespace: api-monetization-data
---
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: monetization-owner-approval-identity
  namespace: api-monetization-data
  labels:
    app.kubernetes.io/part-of: api-monetization
spec:
  provider:
    kubernetes:
      remoteNamespace: api-monetization-identity
      server:
        url: https://kubernetes.default.svc
        caProvider:
          type: ConfigMap
          name: kube-root-ca.crt
          key: ca.crt
      auth:
        serviceAccount:
          name: monetization-control
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: monetization-owner-approval-keycloak
  namespace: api-monetization-data
  labels:
    app.kubernetes.io/part-of: api-monetization
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: SecretStore
    name: monetization-owner-approval-identity
  target:
    name: monetization-owner-approval-keycloak
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      engineVersion: v2
      data:
        client-id: monetization-owner-approvals
        client-secret: "{{ .clientSecret }}"
  data:
    - secretKey: clientSecret
      remoteRef:
        key: monetization-owner-approval-keycloak-client
        property: client-secret
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
        nullBytePolicy: Ignore
