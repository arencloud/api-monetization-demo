apiVersion: v1
kind: Service
metadata:
  name: ai-chat-api
  namespace: api-monetization-apps
  labels:
    app.kubernetes.io/name: ai-chat-api
    app.kubernetes.io/part-of: api-monetization
spec:
  selector: {app.kubernetes.io/name: ai-chat-api}
  ports:
    - {name: http, port: 8080, targetPort: http}
    - {name: http-openapi, port: 8082, targetPort: openapi}
