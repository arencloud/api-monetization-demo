apiVersion: image.openshift.io/v1
kind: ImageStream
metadata:
  name: ai-chat-api
  namespace: api-monetization-apps
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
  labels:
    app.kubernetes.io/part-of: api-monetization
---
apiVersion: build.openshift.io/v1
kind: BuildConfig
metadata:
  name: ai-chat-api
  namespace: api-monetization-apps
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
  labels:
    app.kubernetes.io/name: ai-chat-api
    app.kubernetes.io/part-of: api-monetization
spec:
  runPolicy: SerialLatestOnly
  source:
    type: Git
    git:
      uri: https://github.com/arencloud/api-monetization-demo.git
      ref: main
  strategy:
    type: Docker
    dockerStrategy:
      dockerfilePath: applications/ai-chat/Containerfile
  output:
    to: {kind: ImageStreamTag, name: ai-chat-api:demo}
  successfulBuildsHistoryLimit: 3
  failedBuildsHistoryLimit: 3
  resources:
    requests: {cpu: 250m, memory: 512Mi}
    limits: {cpu: "2", memory: 2Gi}
