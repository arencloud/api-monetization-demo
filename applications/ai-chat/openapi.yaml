openapi: 3.0.3
info:
  title: AI Chat API
  version: 1.0.0
  description: CPU-hosted, token-metered chat inference monetized by Red Hat Connectivity Link.
servers:
  # Replaced by the gateway route-host hook with the admitted OpenShift Route.
  - url: https://api-monetization.invalid
    description: OpenShift API gateway
paths:
  /v1/chat/completions:
    post:
      operationId: createChatCompletion
      summary: Create a non-streaming chat completion
      description: Returns an OpenAI-compatible response and reports prompt plus completion tokens as billable units.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [messages]
              properties:
                model: {type: string, default: ai-chat}
                max_tokens: {type: integer, minimum: 1, maximum: 64, default: 16}
                temperature: {type: number, minimum: 0, maximum: 2, default: 0}
                messages:
                  type: array
                  minItems: 1
                  items:
                    type: object
                    required: [role, content]
                    properties:
                      role: {type: string, enum: [system, user, assistant]}
                      content: {type: string}
      responses:
        "200":
          description: Chat completion with token usage
          headers:
            X-Monetization-Billable-Units:
              description: Prompt plus completion tokens recorded for billing.
              schema: {type: integer}
        "400": {description: Invalid or streaming request}
        "401": {description: API key or Keycloak JWT is missing or invalid}
        "403": {description: The credential has no active AI Chat subscription}
        "429": {description: Connectivity Link request or token quota exceeded}
        "502": {description: Model unavailable or invalid model response}
