apiVersion: v1
kind: ServiceAccount
metadata:
  name: ai-chat-api-builder
  namespace: api-monetization-apps
  annotations: {argocd.argoproj.io/sync-wave: "-2"}
  labels: {app.kubernetes.io/name: ai-chat-api-builder, app.kubernetes.io/part-of: api-monetization}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: ai-chat-api-builder
  namespace: api-monetization-apps
  annotations: {argocd.argoproj.io/sync-wave: "-2"}
  labels: {app.kubernetes.io/name: ai-chat-api-builder, app.kubernetes.io/part-of: api-monetization}
rules:
  - apiGroups: [build.openshift.io]
    resources: [buildconfigs]
    resourceNames: [ai-chat-api]
    verbs: [get]
  - apiGroups: [build.openshift.io]
    resources: [buildconfigs/instantiate]
    resourceNames: [ai-chat-api]
    verbs: [create]
  - apiGroups: [build.openshift.io]
    resources: [builds]
    verbs: [get, list, watch]
  - apiGroups: [image.openshift.io]
    resources: [imagestreams]
    resourceNames: [ai-chat-api]
    verbs: [get, update]
  - apiGroups: [image.openshift.io]
    resources: [imagestreamtags]
    verbs: [get]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: ai-chat-api-builder
  namespace: api-monetization-apps
  annotations: {argocd.argoproj.io/sync-wave: "-2"}
  labels: {app.kubernetes.io/name: ai-chat-api-builder, app.kubernetes.io/part-of: api-monetization}
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: Role, name: ai-chat-api-builder}
subjects:
  - {kind: ServiceAccount, name: ai-chat-api-builder, namespace: api-monetization-apps}
---
apiVersion: batch/v1
kind: Job
metadata:
  name: ai-chat-api-source-build
  namespace: api-monetization-apps
  annotations:
    argocd.argoproj.io/hook: Sync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation,HookSucceeded
    argocd.argoproj.io/sync-wave: "-1"
  labels: {app.kubernetes.io/name: ai-chat-api-source-build, app.kubernetes.io/part-of: api-monetization}
spec:
  activeDeadlineSeconds: 1200
  backoffLimit: 1
  template:
    metadata:
      annotations: {sidecar.istio.io/inject: "false"}
      labels: {app.kubernetes.io/name: ai-chat-api-source-build, app.kubernetes.io/part-of: api-monetization}
    spec:
      serviceAccountName: ai-chat-api-builder
      restartPolicy: Never
      containers:
        - name: build
          image: registry.redhat.io/openshift4/ose-cli-rhel9:v4.22
          imagePullPolicy: IfNotPresent
          env:
            - name: SOURCE_REVISION
              valueFrom:
                fieldRef:
                  fieldPath: metadata.annotations['api-monetization.demo/source-revision']
          command: [/bin/bash, -Eeuo, pipefail, -c]
          args:
            - |
              app=ai-chat-api
              if [[ ! $SOURCE_REVISION =~ ^[0-9a-f]{40}$ ]]; then
                echo "error: Argo CD did not inject a full Git commit into SOURCE_REVISION" >&2
                exit 1
              fi
              immutable_tag="git-${SOURCE_REVISION:0:12}"
              if oc get "imagestreamtag/$app:$immutable_tag" >/dev/null 2>&1; then
                oc tag "$app:$immutable_tag" "$app:demo"
                echo "reused immutable promotion $app:$immutable_tag for $SOURCE_REVISION"
                exit 0
              fi
              echo "building $app from exact revision $SOURCE_REVISION"
              build_name=$(oc start-build "$app" --commit="$SOURCE_REVISION" -o name)
              while true; do
                phase=$(oc get "$build_name" -o jsonpath='{.status.phase}')
                case "$phase" in
                  Complete) break ;;
                  Failed|Error|Cancelled)
                    oc logs "$build_name" || true
                    echo "error: $build_name ended in phase $phase" >&2
                    exit 1
                    ;;
                esac
                sleep 5
              done
              actual_revision=$(oc get "$build_name" -o jsonpath='{.spec.revision.git.commit}')
              digest=$(oc get "$build_name" -o jsonpath='{.status.output.to.imageDigest}')
              if [[ "$actual_revision" != "$SOURCE_REVISION" || "$digest" != sha256:* ]]; then
                echo "error: build provenance is incomplete or does not match $SOURCE_REVISION" >&2
                exit 1
              fi
              oc tag "$app@$digest" "$app:$immutable_tag"
              echo "promoted $app revision $SOURCE_REVISION as $app:$immutable_tag ($digest)"
          resources:
            requests: {cpu: 10m, memory: 64Mi}
            limits: {cpu: 200m, memory: 256Mi}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: [ALL]}
            runAsNonRoot: true
            seccompProfile: {type: RuntimeDefault}
